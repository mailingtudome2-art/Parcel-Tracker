<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcel-Tracking Scanner — ค้นหาเลขพัสดุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#ffffff;
    --panel-2:#eef7ea;
    --ink:#12291a;
    --muted:#4c6152;
    --orange:#1d7a3c;
    --amber:#8a6d00;
    --highlight:#ffdd33;
    --line:#bfdcc2;
    --danger:#c62828;
    --good:#1d7a3c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scroll-behavior:auto;}
  body{overflow-anchor:none;}
  body{
    background:
      radial-gradient(1200px 600px at 90% -10%, #eef7ea 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  ::selection{ background:var(--highlight); color:var(--ink); }
  :focus-visible{ outline:2px solid var(--orange); outline-offset:2px; }

  .wrap{ max-width:880px; margin:0 auto; padding:28px 20px 80px; }

  /* ---------- header ---------- */
  header{ padding-bottom:18px; }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin:0 0 8px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:clamp(28px,5vw,40px);
    margin:0; letter-spacing:-0.01em; line-height:1.05;
  }
  h1 .doc{ color:var(--orange); }
  .sub{ color:var(--muted); margin:10px 0 0; font-size:14.5px; max-width:52ch; }

  .barcode{
    height:14px; margin-top:20px;
    background-image: repeating-linear-gradient(90deg,
      var(--line) 0 2px, transparent 2px 5px,
      var(--line) 5px 8px, transparent 8px 11px,
      var(--line) 11px 12px, transparent 12px 18px);
    opacity:.9;
  }

  section{ margin-top:34px; }
  .label-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px;}
  .section-title{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;
    letter-spacing:.02em; color:var(--ink); margin:0;
  }
  .count-tag{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);
  }

  /* ---------- upload ---------- */
  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:12px 14px;
    text-align:center;
    background:var(--panel);
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--orange);
    background:#e2f3e5;
  }
  #fileInput{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .dropzone{ user-select:none; }
  .dz-title{ font-weight:600; font-size:13px; }
  .dz-sub{ color:var(--muted); font-size:11.5px; margin-top:2px; }
  .dz-icon{
    width:28px;height:28px;margin:0 auto 5px;
    border:1.5px solid var(--muted); border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted); font-size:18px;
  }

  /* ---------- sheet cards ---------- */
  .sheets{ display:flex; flex-direction:column; gap:10px; }
  .sheet-card{
    display:flex; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px;
  }
  .thumb{
    width:46px;height:46px; border-radius:6px; object-fit:cover;
    background:var(--panel-2); flex:none; border:1px solid var(--line);
  }
  .thumb.placeholder{ display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; font-family:'IBM Plex Mono',monospace;}
  .sheet-meta{ flex:1; min-width:0; }
  .sheet-name{ font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheet-status{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; margin-top:2px; }
  .sheet-status.scanning{ color:var(--amber); }
  .sheet-status.done{ color:var(--good); }
  .sheet-status.error{ color:var(--danger); }
  .spinner{
    width:11px;height:11px;border-radius:50%;
    border:2px solid rgba(138,109,0,.25); border-top-color:var(--amber);
    display:inline-block; margin-right:6px; vertical-align:-1px;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .sheet-actions{ display:flex; gap:6px; flex:none; }
  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:6px; width:28px; height:28px; cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ border-color:var(--orange); color:var(--orange); }

  /* ---------- search ---------- */
  .search-box{ position:relative; }
  .search-box input{
    width:100%; background:var(--panel-2); border:1.5px solid var(--line);
    color:var(--ink); border-radius:10px; padding:16px 48px 16px 46px;
    font-family:'IBM Plex Mono',monospace; font-size:17px; letter-spacing:.03em;
  }
  .search-box input::placeholder{ color:var(--muted); font-family:'Inter',sans-serif; letter-spacing:normal;}
  .clear-search{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:38px; height:38px; border:0; border-radius:50%;
    background:#dc2626; color:#fff; cursor:pointer;
    font-size:25px; font-weight:700; line-height:1; display:none;
    align-items:center; justify-content:center;
    padding:0 0 2px; font-family:Arial,sans-serif;
    box-shadow:0 2px 7px rgba(220,38,38,.28);
    -webkit-tap-highlight-color:transparent;
  }
  .clear-search:hover{ background:#b91c1c; color:#fff; }
  .clear-search:active{ transform:translateY(-50%) scale(.92); }
  .clear-search.show{ display:flex; }
  .search-box .glyph{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:16px; pointer-events:none;
  }

  .empty-hint{ color:var(--muted); font-size:13px; margin-top:10px; }

  .results{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .result-row{
    display:flex; align-items:center; gap:14px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px;
  }
  .seq-badge{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
    color:var(--bg); background:var(--ink);
    border-radius:7px; min-width:38px; height:38px;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .result-main{ flex:1; min-width:0; }
  .tracking-no{
    font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:500; letter-spacing:.04em;
    word-break:break-all; color:var(--ink);
  }
  .tracking-no mark{
    background:var(--highlight); color:var(--ink); font-weight:700;
    padding:1px 3px; border-radius:2px;
    box-decoration-break:clone; -webkit-box-decoration-break:clone;
    transform:skew(-2deg);
    display:inline-block;
  }
  .result-src{ color:var(--muted); font-size:11.5px; margin-top:3px; font-family:'IBM Plex Mono',monospace;}
  .no-results{
    color:var(--muted); font-size:14px; padding:18px 4px;
  }

  /* ---------- instant result visibility ---------- */
  .results{
    scroll-margin-top:24px;
  }
  .result-row{
    box-shadow:0 2px 10px rgba(18,41,26,.06);
  }
  /* ผลลัพธ์ทุกแถวมีขนาดเท่ากัน */

  /* On smaller screens, keep the search field and its answer easy to reach. */
  @media (max-width:720px){
    /* มือถือ: ลดพื้นที่ส่วนหัวที่ไม่จำเป็น เพื่อให้ช่องค้นหาและผลลัพธ์อยู่สูงขึ้น */
    .wrap{ padding:12px 14px 40px; }
    header{ padding-bottom:6px; }
    .eyebrow{ margin-bottom:4px; }
    h1{ font-size:30px; line-height:1; }
    .barcode{ height:7px; margin-top:9px; }
    section{ margin-top:20px; }
    .label-row{ margin-bottom:7px; }
    .dropzone{ padding:14px 12px; }
    .dz-title{ font-size:13.5px; }
    .dz-sub{ font-size:11.5px; }
    .dz-icon{ width:28px; height:28px; margin-bottom:6px; font-size:16px; }
    .results{ scroll-margin-top:8px; }
  }

  footer{
    margin-top:46px; padding-top:16px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; color:var(--muted);
    font-family:'IBM Plex Mono',monospace; font-size:11.5px;
  }

  @media (max-width:520px){
    .sheet-card{ flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">บัญชีนำจ่าย · ป.303</p>
    <h1>Parcel-Tracking Scanner</h1>
    <div class="barcode"></div>
  </header>

  <section>
    <div class="label-row">
      <p class="section-title">01 — อัปโหลดใบนำจ่าย</p>
      <span class="count-tag" id="sheetCount">0 ใบ</span>
    </div>
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="อัปโหลดรูปใบนำจ่าย">
      <div class="dz-icon">＋</div>
      <div class="dz-title">ลากรูปมาวาง หรือแตะเพื่อเลือกไฟล์</div>
      <div class="dz-sub">อัปโหลดได้หลายรูป · JPG / PNG / HEIC</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </section>

  <section id="sheetsSection" style="display:none;">
    <div class="sheets" id="sheetsList"></div>
  </section>

  <section>
    <div class="label-row">
      <p class="section-title">02 — ค้นหาเลขพัสดุ</p>
      <span class="count-tag" id="itemCount">0 รายการ</span>
    </div>
    <div class="search-box">
      <span class="glyph">#</span>
      <input type="text" id="searchInput" placeholder="พิมพ์ตัวเลขบางส่วน เช่น 5193 หรือ 0161" inputmode="numeric" autocomplete="off">
      <button type="button" id="clearSearch" class="clear-search" aria-label="ล้างช่องค้นหา" title="ล้างช่องค้นหา">×</button>
    </div>
    <div id="emptyHint" class="empty-hint">ยังไม่มีข้อมูล — อัปโหลดใบนำจ่ายด้านบนก่อน</div>
    <div class="results" id="results"></div>
  </section>

  <footer>
    <span id="footerLeft">ยังไม่มีใบนำจ่าย</span>
    <span>ข้อมูลเก็บไว้ในเบราว์เซอร์นี้เท่านั้น</span>
  </footer>
</div>

<script>
const STORAGE_KEY = 'parcel-tracker-sheets-v1';
let sheets = []; // {id, filename, status, error, items: [{seq, tracking}]}

const sheetsList = document.getElementById('sheetsList');
const sheetsSection = document.getElementById('sheetsSection');
const sheetCount = document.getElementById('sheetCount');
const itemCount = document.getElementById('itemCount');
const resultsEl = document.getElementById('results');
const emptyHint = document.getElementById('emptyHint');
const searchInput = document.getElementById('searchInput');
const clearSearch = document.getElementById('clearSearch');
const footerLeft = document.getElementById('footerLeft');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

function allItems(){
  const out = [];
  for(const s of sheets){
    if(s.status === 'done'){
      for(const it of s.items){
        out.push({ seq: it.seq, tracking: it.tracking, sheetName: s.filename });
      }
    }
  }
  return out;
}

function digitsOnly(str){ return (str||'').replace(/[^0-9]/g,''); }

function render(){
  sheetsSection.style.display = sheets.length ? 'block' : 'none';
  sheetCount.textContent = sheets.length + ' ใบ';
  sheetsList.innerHTML = '';
  for(const s of sheets){
    const card = document.createElement('div');
    card.className = 'sheet-card';

    const thumb = document.createElement(s.thumbUrl ? 'img' : 'div');
    thumb.className = 'thumb' + (s.thumbUrl ? '' : ' placeholder');
    if(s.thumbUrl){ thumb.src = s.thumbUrl; } else { thumb.textContent = 'IMG'; }
    card.appendChild(thumb);

    const meta = document.createElement('div');
    meta.className = 'sheet-meta';
    const name = document.createElement('div');
    name.className = 'sheet-name';
    name.textContent = s.filename;
    const status = document.createElement('div');
    if(s.status === 'scanning'){
      status.className = 'sheet-status scanning';
      status.innerHTML = '<span class="spinner"></span>กำลังอ่านเลขพัสดุ…';
    } else if(s.status === 'done'){
      status.className = 'sheet-status done';
      status.textContent = 'สำเร็จ — พบ ' + s.items.length + ' รายการ';
    } else if(s.status === 'error'){
      status.className = 'sheet-status error';
      status.textContent = 'อ่านไม่สำเร็จ: ' + (s.error || 'ลองใหม่อีกครั้ง');
    }
    meta.appendChild(name);
    meta.appendChild(status);
    card.appendChild(meta);

    const actions = document.createElement('div');
    actions.className = 'sheet-actions';
    if(s.status === 'error'){
      const retryBtn = document.createElement('button');
      retryBtn.className = 'icon-btn';
      retryBtn.title = 'ลองใหม่';
      retryBtn.textContent = '↻';
      retryBtn.onclick = () => retrySheet(s.id);
      actions.appendChild(retryBtn);
    }
    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn';
    delBtn.title = 'ลบ';
    delBtn.textContent = '×';
    delBtn.onclick = () => removeSheet(s.id);
    actions.appendChild(delBtn);
    card.appendChild(actions);

    sheetsList.appendChild(card);
  }

  const items = allItems();
  itemCount.textContent = items.length + ' รายการ';
  footerLeft.textContent = sheets.length
    ? ('ใบนำจ่าย ' + sheets.length + ' ใบ · รวม ' + items.length + ' พัสดุ')
    : 'ยังไม่มีใบนำจ่าย';
  emptyHint.style.display = items.length ? 'none' : 'block';

  runSearch();
  persist();
}

function persist(){
  try{
    const toSave = sheets.map(s => ({
      id: s.id, filename: s.filename, status: s.status === 'scanning' ? 'error' : s.status,
      error: s.status === 'scanning' ? 'ยกเลิกก่อนเสร็จ' : s.error,
      items: s.items || []
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }catch(e){}
}

function restore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      sheets = parsed.map(s => ({...s, thumbUrl:null}));
    }
  }catch(e){ /* no saved data yet */ }
}

function removeSheet(id){
  sheets = sheets.filter(s => s.id !== id);
  render();
}

function isLikelyImage(file){
  if(file.type) return file.type.startsWith('image/');
  return /\.(jpe?g|png|webp|gif|heic|heif|bmp)$/i.test(file.name || '');
}

function normalizeImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('เปิดไฟล์รูปภาพนี้ไม่ได้'));
      img.onload = () => {
        try{
          const maxDim = 2000;
          let { width, height } = img;
          if(width > maxDim || height > maxDim){
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg', dataUrl });
        }catch(e){ reject(new Error('แปลงไฟล์รูปภาพไม่สำเร็จ')); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function extractSheet(base64, mediaType){
  const response = await fetch('/api/extract', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: base64, mediaType })
  });

  let data;
  try{ data = await response.json(); }
  catch(e){ throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง'); }

  if(!response.ok || data.error){
    throw new Error(data.error || 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ');
  }
  if(!data.items || data.items.length === 0){
    throw new Error('อ่านรูปแบบเลขพัสดุไม่สำเร็จ');
  }
  return data.items;
}

async function processFile(file){
  const id = 's' + Date.now() + Math.random().toString(36).slice(2,7);
  const sheet = { id, filename: file.name || 'รูปที่อัปโหลด', status: 'scanning', items: [], thumbUrl: null, _file: file };
  sheets.push(sheet);
  render();

  try{
    const { base64, mediaType, dataUrl } = await normalizeImage(file);
    const target1 = sheets.find(s => s.id === id);
    if(target1){ target1.thumbUrl = dataUrl; render(); }
    const items = await extractSheet(base64, mediaType);
    const target = sheets.find(s => s.id === id);
    if(target){ target.status = 'done'; target.items = items; }
  }catch(err){
    const target = sheets.find(s => s.id === id);
    if(target){ target.status = 'error'; target.error = err.message || 'เกิดข้อผิดพลาด'; }
  }
  render();
}

function retrySheet(id){
  const s = sheets.find(x => x.id === id);
  if(!s || !s._file) return;
  s.status = 'scanning'; s.error = null;
  render();
  (async () => {
    try{
      const { base64, mediaType, dataUrl } = await normalizeImage(s._file);
      s.thumbUrl = dataUrl;
      const items = await extractSheet(base64, mediaType);
      s.status = 'done'; s.items = items;
    }catch(err){
      s.status = 'error'; s.error = err.message || 'เกิดข้อผิดพลาด';
    }
    render();
  })();
}

function handleFiles(fileList){
  const files = Array.from(fileList).filter(isLikelyImage);
  files.forEach(processFile);
}

fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); fileInput.value = ''; });

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fileInput.click(); }
});

['dragenter','dragover'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
});
['dragleave','drop'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); });
});
dropzone.addEventListener('drop', (e) => {
  if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
});

/*
   ล็อกตำแหน่งหน้าจอขณะค้นหา:
   ไม่เลื่อนหน้าอัตโนมัติทุกครั้งที่พิมพ์ เพราะ iPhone จะเด้งขึ้น/ลง
   เมื่อผลลัพธ์ถูกสร้างใหม่ ให้ผู้ใช้เป็นคนเลื่อนเองเมื่อต้องการ
*/
let lastSearchHadMatch = false;

function runSearch(){
  const rawQuery = searchInput.value.trim();
  const q = digitsOnly(rawQuery);
  clearSearch.classList.toggle('show', rawQuery.length > 0);
  resultsEl.innerHTML = '';
  if(!q){
    lastSearchHadMatch = false;
    return;
  }

  const items = allItems();
  const matches = items.filter(it => digitsOnly(it.tracking).includes(q) || it.tracking.includes(q.toUpperCase()));

  if(matches.length === 0){
    lastSearchHadMatch = false;
    const div = document.createElement('div');
    div.className = 'no-results';
    div.textContent = 'ไม่พบเลขพัสดุที่ตรงกับ "' + searchInput.value.trim() + '"';
    resultsEl.appendChild(div);
    return;
  }

  for(const m of matches){
    const row = document.createElement('div');
    row.className = 'result-row';

    const badge = document.createElement('div');
    badge.className = 'seq-badge';
    badge.textContent = m.seq;
    row.appendChild(badge);

    const main = document.createElement('div');
    main.className = 'result-main';

    const trackEl = document.createElement('div');
    trackEl.className = 'tracking-no';
    trackEl.innerHTML = highlightMatch(m.tracking, q);
    main.appendChild(trackEl);

    const src = document.createElement('div');
    src.className = 'result-src';
    src.textContent = 'จาก ' + m.sheetName;
    main.appendChild(src);

    row.appendChild(main);
    resultsEl.appendChild(row);
  }

  lastSearchHadMatch = true;
}

function highlightMatch(tracking, query){
  const idx = tracking.indexOf(query.toUpperCase());
  if(idx === -1) return escapeHtml(tracking);
  const before = tracking.slice(0, idx);
  const match = tracking.slice(idx, idx + query.length);
  const after = tracking.slice(idx + query.length);
  return escapeHtml(before) + '<mark>' + escapeHtml(match) + '</mark>' + escapeHtml(after);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

searchInput.addEventListener('input', runSearch);

clearSearch.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  searchInput.value = '';
  clearSearch.classList.remove('show');
  resultsEl.innerHTML = '';
  lastSearchHadMatch = false;
  searchInput.focus();
});

searchInput.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    e.preventDefault();
    searchInput.value = '';
    clearSearch.classList.remove('show');
    resultsEl.innerHTML = '';
    lastSearchHadMatch = false;
  }
});

restore();
render();
</script>
