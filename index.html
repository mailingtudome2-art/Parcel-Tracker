<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ป.303 SCANNER</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f1f8f4;
      color: #243044;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 18px 50px;
    }

    .card {
      background: #ffffff;
      border-radius: 30px;
      padding: 34px;
      margin-bottom: 24px;

      box-shadow:
        0 8px 30px rgba(0, 80, 40, 0.08);
    }

    /* =========================
       TITLE
    ========================= */

    .title {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 40px;
      font-weight: 800;

      color: #13864b;

      margin-bottom: 18px;
    }

    .title-icon {
      font-size: 40px;
    }

    .subtitle {
      font-size: 23px;
      color: #737d8d;

      margin-bottom: 26px;

      line-height: 1.5;
    }


    /* =========================
       UPLOAD
    ========================= */

    .upload-area {
      border: 3px dashed #67c797;

      background: #f4fff9;

      border-radius: 22px;

      min-height: 210px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      cursor: pointer;

      transition: 0.2s;

      overflow: hidden;

      position: relative;
    }

    .upload-area:hover {
      background: #ecfff5;
    }

    .upload-icon {
      font-size: 54px;
      margin-bottom: 8px;
    }

    .upload-title {
      font-size: 28px;
      font-weight: 700;
      color: #16864c;
    }

    .upload-subtitle {
      margin-top: 7px;
      font-size: 20px;
      color: #747d8c;
    }

    #fileInput {
      display: none;
    }

    #preview {
      max-width: 100%;
      max-height: 300px;

      display: none;

      border-radius: 14px;

      object-fit: contain;
    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: flex;
      gap: 18px;

      margin-top: 26px;
    }

    button {
      border: 0;

      border-radius: 18px;

      padding: 17px 28px;

      font-size: 23px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      flex: 1;

      background: #128247;

      color: white;
    }

    .btn-primary:disabled {
      background: #9bcfb4;

      cursor: not-allowed;
    }

    .btn-secondary {
      background: #e6f5ec;

      color: #14834a;

      min-width: 180px;
    }


    /* =========================
       PROGRESS
    ========================= */

    .progress-wrap {
      display: none;

      margin-top: 24px;
    }

    .progress-text {
      font-size: 19px;

      color: #16864c;

      margin-bottom: 10px;

      font-weight: 600;
    }

    .progress-bg {
      height: 15px;

      background: #e5eee9;

      border-radius: 20px;

      overflow: hidden;
    }

    .progress-bar {
      width: 0%;

      height: 100%;

      background: #15904f;

      border-radius: 20px;

      transition: width 0.25s;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      margin-top: 22px;

      padding: 19px 23px;

      border-radius: 18px;

      background: #effcf4;

      color: #176d43;

      font-size: 23px;

      line-height: 1.5;
    }

    .status.error {
      background: #fff0f0;

      color: #c53030;
    }


    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 22px;

      margin-bottom: 25px;
    }

    .stat {
      border: 2px solid #d6eee0;

      background: #f6fff9;

      border-radius: 22px;

      padding: 25px;
    }

    .stat-label {
      color: #778193;

      font-size: 20px;

      margin-bottom: 7px;
    }

    .stat-value {
      color: #15874d;

      font-size: 46px;

      font-weight: 800;
    }


    /* =========================
       SEARCH
    ========================= */

    .search-box {
      width: 100%;

      height: 68px;

      border: 2px solid #d4d9df;

      border-radius: 20px;

      padding: 0 24px;

      font-size: 26px;

      outline: none;

      color: #243044;

      margin-bottom: 24px;
    }

    .search-box:focus {
      border-color: #51b77e;
    }


    /* =========================
       RESULT COUNT
    ========================= */

    .result-count {
      font-size: 21px;

      color: #737d8d;

      margin-bottom: 17px;
    }


    /* =========================
       RESULT
    ========================= */

    .result-item {
      background: white;

      border: 2px solid #e4e8ed;

      border-radius: 18px;

      padding: 15px 20px;

      margin-bottom: 11px;

      display: flex;

      align-items: center;

      gap: 15px;

      overflow: hidden;
    }

    .result-seq {
      color: #16864c;

      font-size: 24px;

      font-weight: 800;

      min-width: 70px;

      flex-shrink: 0;
    }

    /*
      ลดขนาดเลขพัสดุลงเล็กน้อย
    */

    .result-tracking {
      font-size: 23px;

      font-weight: 700;

      color: #202938;

      letter-spacing: 0.3px;

      word-break: break-all;
    }


    /* =========================
       HIGHLIGHT
    ========================= */

    .highlight {
      background: #fff200;

      color: #111;

      padding: 0 2px;

      border-radius: 2px;
    }


    .empty {
      text-align: center;

      color: #89919e;

      font-size: 20px;

      padding: 30px 10px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .container {
        padding: 18px 12px 40px;
      }

      .card {
        padding: 22px 18px;

        border-radius: 25px;
      }

      .title {
        font-size: 32px;
      }

      .title-icon {
        font-size: 34px;
      }

      .subtitle {
        font-size: 19px;
      }

      .upload-title {
        font-size: 25px;
      }

      .upload-subtitle {
        font-size: 18px;
      }

      .buttons {
        gap: 12px;
      }

      button {
        font-size: 20px;

        padding: 15px 14px;
      }

      .stats {
        gap: 12px;
      }

      .stat {
        padding: 19px 15px;
      }

      .stat-label {
        font-size: 17px;
      }

      .stat-value {
        font-size: 39px;
      }

      .search-box {
        height: 64px;

        font-size: 23px;

        margin-bottom: 22px;
      }

      .result-item {
        padding: 13px 15px;

        gap: 8px;
      }

      .result-seq {
        min-width: 58px;

        font-size: 21px;
      }

      .result-tracking {
        font-size: 21px;
      }

      .result-count {
        font-size: 19px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       MAIN CARD
  ====================================================== -->

  <div class="card">


    <div class="title">

      <span class="title-icon">
        📦
      </span>

      <span>
        ป.303 SCANNER
      </span>

    </div>


    <div class="subtitle">

      ระบบอ่านเลขพัสดุจากบัญชีนำจ่าย ป.303

    </div>


    <!-- UPLOAD -->

    <label
      class="upload-area"
      for="fileInput"
    >

      <div id="uploadContent">

        <div class="upload-icon">
          📷
        </div>

        <div class="upload-title">
          เลือกรูปภาพ ป.303
        </div>

        <div class="upload-subtitle">

    <!-- BUTTONS -->

    <div class="buttons">

      </button>

      </button>

    </div>


    <!-- PROGRESS -->

    <div
      id="progressWrap"
      class="progress-wrap"
    >

      <div
        id="progressText"
        class="progress-text"
      >
        กำลังเตรียมภาพ...
      </div>


      <div class="progress-bg">

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="status"
      style="display:none;"
    ></div>


  </div>



  <!-- =====================================================
       RESULT CARD
  ====================================================== -->

  <div class="card">


    <!-- STATS -->

    <div class="stats">


      <div class="stat">

        <div class="stat-label">
          จำนวนที่อ่านได้
        </div>

        <div
          id="countValue"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          สูงสุดที่รองรับ
        </div>

        <div class="stat-value">
          100
        </div>

      </div>


    </div>


    <!-- =================================================
         SEARCH INPUT

         ไม่มีปุ่มค้นหา
         พิมพ์แล้วค้นหาอัตโนมัติ
    ================================================== -->

    <input
      id="searchInput"
      class="search-box"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="พิมพ์เลขพัสดุเพื่อค้นหา"
    >


    <!-- RESULT COUNT -->

    <div
      id="resultCount"
      class="result-count"
    >
      ยังไม่มีข้อมูล
    </div>


    <!-- RESULTS -->

    <div id="results">

      <div class="empty">
        ผลการอ่านจะแสดงที่นี่
      </div>

    </div>


  </div>


</div>



<script>


/* =========================================================
   GLOBAL
========================================================= */

let currentFile = null;

let currentItems = [];

const MAX_ITEMS = 100;



/* =========================================================
   DOM
========================================================= */

const fileInput =
  document.getElementById(
    'fileInput'
  );

const preview =
  document.getElementById(
    'preview'
  );

const uploadContent =
  document.getElementById(
    'uploadContent'
  );

const readButton =
  document.getElementById(
    'readButton'
  );

const clearButton =
  document.getElementById(
    'clearButton'
  );

const progressWrap =
  document.getElementById(
    'progressWrap'
  );

const progressText =
  document.getElementById(
    'progressText'
  );

const progressBar =
  document.getElementById(
    'progressBar'
  );

const status =
  document.getElementById(
    'status'
  );

const countValue =
  document.getElementById(
    'countValue'
  );

const searchInput =
  document.getElementById(
    'searchInput'
  );

const resultCount =
  document.getElementById(
    'resultCount'
  );

const results =
  document.getElementById(
    'results'
  );



/* =========================================================
   SELECT FILE
========================================================= */

fileInput.addEventListener(
  'change',
  function(){

    const file =
      this.files &&
      this.files[0];


    if(!file){
      return;
    }


    currentFile =
      file;


    const url =
      URL.createObjectURL(
        file
      );


    preview.src =
      url;


    preview.style.display =
      'block';


    uploadContent.style.display =
      'none';


    readButton.disabled =
      false;


    status.style.display =
      'none';

  }
);



/* =========================================================
   CLEAR
========================================================= */

clearButton.addEventListener(
  'click',
  function(){

    currentFile =
      null;


    currentItems =
      [];


    fileInput.value =
      '';


    preview.src =
      '';


    preview.style.display =
      'none';


    uploadContent.style.display =
      'block';


    readButton.disabled =
      true;


    progressWrap.style.display =
      'none';


    progressBar.style.width =
      '0%';


    status.style.display =
      'none';


    countValue.textContent =
      '0';


    resultCount.textContent =
      'ยังไม่มีข้อมูล';


    searchInput.value =
      '';


    results.innerHTML =
      '<div class="empty">ผลการอ่านจะแสดงที่นี่</div>';

  }
);



/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(file){

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();


      img.onload =
        () => {

          URL.revokeObjectURL(
            img.src
          );

          resolve(img);

        };


      img.onerror =
        () => {

          URL.revokeObjectURL(
            img.src
          );

          reject(
            new Error(
              'เปิดรูปภาพไม่สำเร็จ'
            )
          );

        };


      img.src =
        URL.createObjectURL(
          file
        );

    }
  );

}



/* =========================================================
   NORMALIZE IMAGE

   รองรับสูงสุด 100

   แบ่ง 4 คอลัมน์
========================================================= */

async function normalizeImage(file){

  const img =
    await loadImage(
      file
    );


  const srcW =
    img.naturalWidth;


  const srcH =
    img.naturalHeight;


  /*
    พื้นที่ตาราง

    ขยายแนวตั้งเพื่อไม่ให้
    แถวล่างหาย
  */

  const cropX =
    Math.round(
      srcW * 0.065
    );


  const cropY =
    Math.round(
      srcH * 0.285
    );


  const cropW =
    Math.round(
      srcW * 0.855
    );


  const cropH =
    Math.round(
      srcH * 0.635
    );


  const safeX =
    Math.max(
      0,
      Math.min(
        cropX,
        srcW - 1
      )
    );


  const safeY =
    Math.max(
      0,
      Math.min(
        cropY,
        srcH - 1
      )
    );


  const safeW =
    Math.min(
      cropW,
      srcW - safeX
    );


  const safeH =
    Math.min(
      cropH,
      srcH - safeY
    );


  const colGap =
    Math.max(
      2,
      Math.round(
        safeW * 0.009
      )
    );


  const colW =
    Math.floor(
      (
        safeW -
        colGap * 3
      ) / 4
    );


  const scale =
    2.0;


  const images =
    [];


  for(
    let columnIndex = 0;
    columnIndex < 4;
    columnIndex++
  ){

    const sx =
      safeX +
      columnIndex *
      (
        colW +
        colGap
      );


    const sy =
      safeY;


    const sw =
      colW;


    const sh =
      safeH;


    const canvas =
      document.createElement(
        'canvas'
      );


    canvas.width =
      Math.round(
        sw * scale
      );


    canvas.height =
      Math.round(
        sh * scale
      );


    const ctx =
      canvas.getContext(
        '2d',
        {
          alpha: false
        }
      );


    ctx.fillStyle =
      '#ffffff';


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.imageSmoothingEnabled =
      true;


    ctx.imageSmoothingQuality =
      'high';


    ctx.drawImage(
      img,

      sx,
      sy,
      sw,
      sh,

      0,
      0,
      canvas.width,
      canvas.height
    );


    const dataUrl =
      canvas.toDataURL(
        'image/jpeg',
        0.68
      );


    images.push(
      dataUrl.split(',')[1]
    );

  }


  return {

    images,

    mediaType:
      'image/jpeg'

  };

}



/* =========================================================
   EXTRACT COLUMN
========================================================= */

async function extractColumn(
  image,
  mediaType,
  columnIndex
){

  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      () => {

        controller.abort();

      },
      35000
    );


  try{

    const response =
      await fetch(
        '/api/extract',
        {

          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

              image:
                image,

              mediaType:
                mediaType ||
                'image/jpeg',

              columnIndex:
                columnIndex

            }),

          signal:
            controller.signal

        }
      );


    const rawText =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(
          rawText
        );

    }catch(e){

      throw new Error(
        'Server ส่งข้อมูลกลับมาไม่ใช่ JSON'
      );

    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        `HTTP ${response.status}`
      );

    }


    if(
      !Array.isArray(
        data?.items
      )
    ){

      throw new Error(
        'Server ไม่ส่งรายการ items กลับมา'
      );

    }


    return data.items;


  }catch(error){

    if(
      error.name ===
      'AbortError'
    ){

      throw new Error(
        `คอลัมน์ที่ ${
          columnIndex + 1
        } ใช้เวลานานเกินไป`
      );

    }


    throw error;


  }finally{

    clearTimeout(
      timeout
    );

  }

}



/* =========================================================
   NORMALIZE ITEM
========================================================= */

function normalizeItem(item){

  if(!item){
    return null;
  }


  let seq =
    item.seq ??
    item.sequence;


  let tracking =
    item.tracking ??
    item.tracking_number;


  if(
    seq === undefined ||
    seq === null
  ){

    return null;

  }


  seq =
    parseInt(
      String(seq)
        .replace(
          /\D/g,
          ''
        ),
      10
    );


  if(
    !Number.isFinite(
      seq
    )
  ){

    return null;

  }


  if(
    seq < 1 ||
    seq > MAX_ITEMS
  ){

    return null;

  }


  if(!tracking){
    return null;
  }


  tracking =
    String(
      tracking
    )
      .toUpperCase()
      .replace(
        /[\s-]/g,
        ''
      );


  const match =
    tracking.match(
      /^([A-Z]{2})(\d{9})(TH)?$/
    );


  if(!match){

    return null;

  }


  return {

    seq:
      seq,

    tracking:
      match[1] +
      match[2] +
      'TH'

  };

}



/* =========================================================
   COMBINE
========================================================= */

function combineItems(all){

  const map =
    new Map();


  for(
    const raw of all
  ){

    const item =
      normalizeItem(
        raw
      );


    if(!item){
      continue;
    }


    /*
      ป้องกัน sequence ซ้ำ
    */

    if(
      !map.has(
        item.seq
      )
    ){

      map.set(
        item.seq,
        item
      );

    }

  }


  return Array
    .from(
      map.values()
    )
    .sort(
      (a,b) =>
        a.seq - b.seq
    )
    .slice(
      0,
      MAX_ITEMS
    );

}



/* =========================================================
   READ SHEET
========================================================= */

async function readSheet(){

  if(!currentFile){

    throw new Error(
      'กรุณาเลือกรูปภาพก่อน'
    );

  }


  progressWrap.style.display =
    'block';


  status.style.display =
    'none';


  progressBar.style.width =
    '2%';


  progressText.textContent =
    'กำลังเตรียมภาพ...';


  const {
    images,
    mediaType
  } =
    await normalizeImage(
      currentFile
    );


  let allItems =
    [];


  /*
    อ่าน 4 คอลัมน์
    ทีละคอลัมน์
  */

  for(
    let columnIndex = 0;
    columnIndex < 4;
    columnIndex++
  ){

    progressText.textContent =
      `กำลังอ่านคอลัมน์ ${
        columnIndex + 1
      } / 4...`;


    const progress =
      5 +
      columnIndex * 23;


    progressBar.style.width =
      `${progress}%`;


    const items =
      await extractColumn(
        images[columnIndex],
        mediaType,
        columnIndex
      );


    allItems =
      allItems.concat(
        items
      );


    /*
      รวมข้อมูล
    */

    currentItems =
      combineItems(
        allItems
      );


    /*
      จำนวนที่อ่านได้จริง
    */

    countValue.textContent =
      currentItems.length;


    /*
      แสดงรายการระหว่างอ่าน
    */

    renderResults(
      currentItems
    );


    progressBar.style.width =
      `${progress + 20}%`;

  }


  /*
    รวมสุดท้าย
  */

  currentItems =
    combineItems(
      allItems
    );


  /*
    จำนวนที่อ่านได้จริง

    ถ้าอ่านได้ 82 รายการ
    ต้องแสดง 82

    ไม่ใช้ max sequence
  */

  countValue.textContent =
    currentItems.length;


  progressBar.style.width =
    '100%';


  progressText.textContent =
    'อ่านเสร็จแล้ว';


  resultCount.textContent =
    `ทั้งหมด ${currentItems.length} รายการ`;


  /*
    แสดงทั้งหมด
  */

  renderResults(
    currentItems
  );


  status.style.display =
    'block';


  status.className =
    'status';


  status.textContent =
    `อ่านเสร็จแล้ว พบ ${currentItems.length} รายการ`;

}



/* =========================================================
   READ BUTTON
========================================================= */

readButton.addEventListener(
  'click',
  async function(){

    if(!currentFile){
      return;
    }


    readButton.disabled =
      true;


    try{

      await readSheet();


    }catch(error){

      console.error(
        error
      );


      status.style.display =
        'block';


      status.className =
        'status error';


      status.textContent =
        'อ่านไม่สำเร็จ: ' +
        (
          error.message ||
          'เกิดข้อผิดพลาด'
        );


      progressText.textContent =
        'เกิดข้อผิดพลาด';


    }finally{

      readButton.disabled =
        false;

    }

  }
);



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}



/* =========================================================
   HIGHLIGHT SEARCH

   เช่นพิมพ์:

   4914

   JG082049144TH

   จะ highlight:

   JG0820[4914]4TH
========================================================= */

function highlightMatch(
  tracking,
  query
){

  const text =
    String(
      tracking || ''
    );


  const q =
    String(
      query || ''
    )
      .trim()
      .toUpperCase();


  if(!q){

    return escapeHtml(
      text
    );

  }


  /*
    ถ้าพิมพ์ตัวเลข
  */

  if(
    /^\d+$/.test(q)
  ){

    const escaped =
      escapeHtml(
        text
      );


    const regex =
      new RegExp(
        q,
        'g'
      );


    return escaped.replace(
      regex,
      '<span class="highlight">$&</span>'
    );

  }


  /*
    ถ้าค้น tracking เต็ม
  */

  const escaped =
    escapeHtml(
      text
    );


  const index =
    escaped
      .toUpperCase()
      .indexOf(
        q
      );


  if(index === -1){

    return escaped;

  }


  return (
    escaped.slice(
      0,
      index
    ) +

    '<span class="highlight">' +

    escaped.slice(
      index,
      index + q.length
    ) +

    '</span>' +

    escaped.slice(
      index + q.length
    )
  );

}



/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults(
  items,
  query = ''
){

  if(!items.length){

    results.innerHTML =
      '<div class="empty">ไม่พบข้อมูล</div>';

    return;

  }


  /*
    เรียงลำดับ 1 → 100
  */

  const sorted =
    [...items].sort(
      (a,b) =>
        a.seq - b.seq
    );


  results.innerHTML =
    sorted
      .map(
        item => {

          return `
            <div class="result-item">

              <div class="result-seq">
                #${escapeHtml(
                  item.seq
                )}
              </div>

              <div class="result-tracking">
                ${highlightMatch(
                  item.tracking,
                  query
                )}
              </div>

            </div>
          `;

        }
      )
      .join('');

}



/* =========================================================
   AUTO SEARCH

   จุดสำคัญ:

   ไม่ต้องกดปุ่มค้นหา

   พิมพ์:
   4
   49
   491
   4914

   ระบบค้นหาให้ทันที
========================================================= */

searchInput.addEventListener(
  'input',
  function(){

    const query =
      this.value.trim();


    /*
      ถ้าไม่พิมพ์อะไร
      แสดงทั้งหมด
    */

    if(!query){

      resultCount.textContent =
        `ทั้งหมด ${currentItems.length} รายการ`;


      renderResults(
        currentItems
      );


      return;

    }


    const qUpper =
      query.toUpperCase();


    const qDigits =
      query.replace(
        /\D/g,
        ''
      );


    const filtered =
      currentItems.filter(
        item => {

          const tracking =
            String(
              item.tracking || ''
            ).toUpperCase();


          /*
            ค้นแบบตัวอักษร/เลขเต็ม
          */

          if(
            tracking.includes(
              qUpper
            )
          ){

            return true;

          }


          /*
            ค้นเฉพาะตัวเลข

            4914
            จะเจอ

            JG082049144TH
          */

          if(
            qDigits &&
            tracking
              .replace(
                /\D/g,
                ''
              )
              .includes(
                qDigits
              )
          ){

            return true;

          }


          return false;

        }
      );


    /*
      แสดงจำนวนผลค้นหา
    */

    resultCount.textContent =
      `พบ ${filtered.length} รายการ`;


    /*
      แสดงเฉพาะรายการที่ค้นเจอ
    */

    renderResults(
      filtered,
      query
    );

  }
);



</script>
