<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ป.303 SCANNER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f1f8f4;
      color: #243044;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 18px 50px;
    }

    .card {
      background: #ffffff;
      border-radius: 30px;
      padding: 34px;
      margin-bottom: 24px;
      box-shadow: 0 8px 30px rgba(0, 80, 40, 0.08);
    }

    .title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 42px;
      font-weight: 800;
      color: #13864b;
      margin-bottom: 22px;
    }

    .title-icon {
      font-size: 42px;
    }

    .subtitle {
      font-size: 25px;
      color: #737d8d;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .upload-area {
      border: 3px dashed #67c797;
      background: #f4fff9;
      border-radius: 22px;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      overflow: hidden;
      position: relative;
    }

    .upload-area:hover {
      background: #ecfff5;
    }

    .upload-icon {
      font-size: 58px;
      margin-bottom: 10px;
    }

    .upload-title {
      font-size: 30px;
      font-weight: 700;
      color: #16864c;
    }

    .upload-subtitle {
      margin-top: 8px;
      font-size: 21px;
      color: #747d8c;
    }

    #fileInput {
      display: none;
    }

    #preview {
      max-width: 100%;
      max-height: 300px;
      display: none;
      border-radius: 14px;
      object-fit: contain;
    }

    .buttons {
      display: flex;
      gap: 18px;
      margin-top: 26px;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 18px 30px;
      font-size: 25px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      flex: 1;
      background: #128247;
      color: white;
    }

    .btn-primary:disabled {
      background: #9bcfb4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #e6f5ec;
      color: #14834a;
      min-width: 180px;
    }

    .progress-wrap {
      display: none;
      margin-top: 24px;
    }

    .progress-text {
      font-size: 20px;
      color: #16864c;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .progress-bg {
      height: 16px;
      background: #e5eee9;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #15904f;
      border-radius: 20px;
      transition: width 0.25s;
    }

    .status {
      margin-top: 22px;
      padding: 20px 24px;
      border-radius: 18px;
      background: #effcf4;
      color: #176d43;
      font-size: 24px;
      line-height: 1.5;
    }

    .status.error {
      background: #fff0f0;
      color: #c53030;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-bottom: 28px;
    }

    .stat {
      border: 2px solid #d6eee0;
      background: #f6fff9;
      border-radius: 22px;
      padding: 28px;
    }

    .stat-label {
      color: #778193;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .stat-value {
      color: #15874d;
      font-size: 48px;
      font-weight: 800;
    }

    .search-box {
      width: 100%;
      height: 70px;
      border: 2px solid #d4d9df;
      border-radius: 20px;
      padding: 0 25px;
      font-size: 27px;
      outline: none;
      color: #243044;
      margin-bottom: 18px;
    }

    .search-box:focus {
      border-color: #51b77e;
    }

    .search-button {
      width: 100%;
      background: #08783f;
      color: white;
      margin-bottom: 28px;
    }

    .search-result-count {
      font-size: 22px;
      color: #737d8d;
      margin-bottom: 18px;
    }

    .result-item {
      background: white;
      border: 2px solid #e4e8ed;
      border-radius: 20px;
      padding: 20px 25px;
      margin-bottom: 13px;
      display: flex;
      align-items: center;
      gap: 20px;
      overflow: hidden;
    }

    .result-seq {
      color: #16864c;
      font-size: 28px;
      font-weight: 800;
      min-width: 85px;
    }

    .result-tracking {
      font-size: 29px;
      font-weight: 750;
      color: #202938;
      letter-spacing: 0.5px;
      word-break: break-all;
    }

    .highlight {
      background: #fff200;
      color: #111;
      padding: 0 2px;
      border-radius: 2px;
    }

    .empty {
      text-align: center;
      color: #89919e;
      font-size: 21px;
      padding: 30px 10px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px 12px 40px;
      }

      .card {
        padding: 22px 18px;
        border-radius: 25px;
      }

      .title {
        font-size: 32px;
      }

      .title-icon {
        font-size: 34px;
      }

      .subtitle {
        font-size: 20px;
      }

      .upload-title {
        font-size: 25px;
      }

      .upload-subtitle {
        font-size: 18px;
      }

      .buttons {
        gap: 12px;
      }

      button {
        font-size: 21px;
        padding: 16px 15px;
      }

      .stats {
        gap: 12px;
      }

      .stat {
        padding: 20px 16px;
      }

      .stat-label {
        font-size: 18px;
      }

      .stat-value {
        font-size: 40px;
      }

      .search-box {
        font-size: 23px;
      }

      .result-item {
        padding: 16px;
        gap: 10px;
      }

      .result-seq {
        min-width: 65px;
        font-size: 23px;
      }

      .result-tracking {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- MAIN CARD -->
  <div class="card">

    <div class="title">
      <span class="title-icon">📦</span>
      <span>ป.303 SCANNER</span>
    </div>

    <div class="subtitle">
      ระบบอ่านเลขพัสดุจากบัญชีนำจ่าย ป.303
    </div>

    <label class="upload-area" for="fileInput">

      <div id="uploadContent">
        <div class="upload-icon">📷</div>

        <div class="upload-title">
          เลือกรูปภาพ ป.303
        </div>

        <div class="upload-subtitle">
          รองรับ JPG / JPEG / PNG
        </div>
      </div>

      <img id="preview" alt="preview">

    </label>

    <input
      type="file"
      id="fileInput"
      accept="image/jpeg,image/jpg,image/png"
    >

    <div class="buttons">

      <button
        id="readButton"
        class="btn-primary"
        disabled
      >
        🔍 อ่านเลขพัสดุ
      </button>

      <button
        id="clearButton"
        class="btn-secondary"
      >
        ล้างข้อมูล
      </button>

    </div>

    <div id="progressWrap" class="progress-wrap">

      <div id="progressText" class="progress-text">
        กำลังเตรียมรูปภาพ...
      </div>

      <div class="progress-bg">
        <div id="progressBar" class="progress-bar"></div>
      </div>

    </div>

    <div id="status" class="status" style="display:none;"></div>

  </div>


  <!-- RESULTS CARD -->
  <div class="card">

    <div class="stats">

      <div class="stat">
        <div class="stat-label">
          จำนวนที่อ่านได้
        </div>

        <div id="countValue" class="stat-value">
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          สูงสุดที่รองรับ
        </div>

        <div class="stat-value">
          100
        </div>
      </div>

    </div>


    <input
      id="searchInput"
      class="search-box"
      type="text"
      inputmode="numeric"
      placeholder="ค้นหาเลขพัสดุ"
    >

    <button
      id="searchButton"
      class="search-button"
    >
      🔎 ค้นหา
    </button>

    <div id="searchCount" class="search-result-count">
      ยังไม่มีข้อมูล
    </div>

    <div id="results">
      <div class="empty">
        ผลการอ่านจะแสดงที่นี่
      </div>
    </div>

  </div>

</div>


<script>

  /* =========================================================
     GLOBAL
  ========================================================= */

  let currentFile = null;

  let currentItems = [];

  const MAX_ITEMS = 100;


  /* =========================================================
     DOM
  ========================================================= */

  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const uploadContent = document.getElementById('uploadContent');

  const readButton = document.getElementById('readButton');
  const clearButton = document.getElementById('clearButton');

  const progressWrap = document.getElementById('progressWrap');
  const progressText = document.getElementById('progressText');
  const progressBar = document.getElementById('progressBar');

  const status = document.getElementById('status');

  const countValue = document.getElementById('countValue');

  const searchInput = document.getElementById('searchInput');
  const searchButton = document.getElementById('searchButton');

  const searchCount = document.getElementById('searchCount');
  const results = document.getElementById('results');


  /* =========================================================
     FILE SELECT
  ========================================================= */

  fileInput.addEventListener('change', function(){

    const file = this.files && this.files[0];

    if(!file){
      return;
    }

    currentFile = file;

    const url = URL.createObjectURL(file);

    preview.src = url;

    preview.style.display = 'block';

    uploadContent.style.display = 'none';

    readButton.disabled = false;

    status.style.display = 'none';

  });


  /* =========================================================
     CLEAR
  ========================================================= */

  clearButton.addEventListener('click', function(){

    currentFile = null;

    currentItems = [];

    fileInput.value = '';

    preview.src = '';

    preview.style.display = 'none';

    uploadContent.style.display = 'block';

    readButton.disabled = true;

    progressWrap.style.display = 'none';

    progressBar.style.width = '0%';

    status.style.display = 'none';

    countValue.textContent = '0';

    searchCount.textContent = 'ยังไม่มีข้อมูล';

    results.innerHTML =
      '<div class="empty">ผลการอ่านจะแสดงที่นี่</div>';

    searchInput.value = '';

  });


  /* =========================================================
     LOAD IMAGE
  ========================================================= */

  function loadImage(file){

    return new Promise((resolve, reject) => {

      const img = new Image();

      img.onload = () => {

        URL.revokeObjectURL(img.src);

        resolve(img);

      };

      img.onerror = () => {

        URL.revokeObjectURL(img.src);

        reject(new Error('เปิดรูปภาพไม่สำเร็จ'));

      };

      img.src = URL.createObjectURL(file);

    });

  }


  /* =========================================================
     IMAGE PREPROCESSING
     
     IMPORTANT:
     - ขยายพื้นที่ crop แนวตั้ง
     - รองรับ 100 รายการ
     - แบ่ง 4 คอลัมน์
     - ไม่ crop แถวล่างทิ้ง
  ========================================================= */

  async function normalizeImage(file){

    const img = await loadImage(file);

    const srcW = img.naturalWidth;
    const srcH = img.naturalHeight;


    /*
      ปรับจาก crop เดิมที่แคบเกินไป

      เดิม:
      cropY = 0.345
      cropH = 0.420

      ใหม่:
      เริ่มสูงขึ้น
      และยาวลงไปเกือบสุดตาราง

      เพื่อให้รองรับ 80-100 แถว
    */

    const cropX = Math.round(srcW * 0.065);

    const cropY = Math.round(srcH * 0.285);

    const cropW = Math.round(srcW * 0.855);

    const cropH = Math.round(srcH * 0.635);


    /*
      กัน crop เกินขอบรูป
    */

    const safeX = Math.max(
      0,
      Math.min(cropX, srcW - 1)
    );

    const safeY = Math.max(
      0,
      Math.min(cropY, srcH - 1)
    );

    const safeW = Math.min(
      cropW,
      srcW - safeX
    );

    const safeH = Math.min(
      cropH,
      srcH - safeY
    );


    /*
      ช่องว่างระหว่างคอลัมน์
    */

    const colGap = Math.max(
      2,
      Math.round(safeW * 0.009)
    );


    const colW = Math.floor(
      (safeW - colGap * 3) / 4
    );


    /*
      เพิ่ม resolution ให้เลขพัสดุ
    */

    const scale = 2.0;


    const images = [];


    for(let columnIndex = 0; columnIndex < 4; columnIndex++){

      const sx =
        safeX +
        columnIndex * (colW + colGap);


      const sy = safeY;


      const sw = colW;


      const sh = safeH;


      const outputCanvas =
        document.createElement('canvas');


      outputCanvas.width =
        Math.round(sw * scale);


      outputCanvas.height =
        Math.round(sh * scale);


      const ctx =
        outputCanvas.getContext('2d', {
          alpha: false
        });


      /*
        พื้นหลังขาว
      */

      ctx.fillStyle = '#ffffff';

      ctx.fillRect(
        0,
        0,
        outputCanvas.width,
        outputCanvas.height
      );


      /*
        ทำภาพให้คมขึ้นเล็กน้อย
      */

      ctx.imageSmoothingEnabled = true;

      ctx.imageSmoothingQuality = 'high';


      ctx.drawImage(
        img,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        outputCanvas.width,
        outputCanvas.height
      );


      /*
        JPEG 0.68

        สมดุลระหว่าง:
        - ความคม
        - ขนาด request
        - ความเร็ว
      */

      const dataUrl =
        outputCanvas.toDataURL(
          'image/jpeg',
          0.68
        );


      images.push(
        dataUrl.split(',')[1]
      );

    }


    return {

      images,

      mediaType: 'image/jpeg',

      originalWidth: srcW,

      originalHeight: srcH

    };

  }


  /* =========================================================
     EXTRACT ONE COLUMN
     
     ส่งทีละคอลัมน์
     
     4 requests:
     column 0
     column 1
     column 2
     column 3

     ทำ sequential เพื่อไม่ยิง Gemini 4 request
     พร้อมกัน
  ========================================================= */

  async function extractColumn(
    image,
    mediaType,
    columnIndex
  ){

    const controller =
      new AbortController();


    const timeout =
      setTimeout(() => {

        controller.abort();

      }, 35000);


    try{

      const response =
        await fetch('/api/extract', {

          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({

            image: image,

            mediaType:
              mediaType || 'image/jpeg',

            columnIndex:
              columnIndex

          }),

          signal:
            controller.signal

        });


      const rawText =
        await response.text();


      let data;


      try{

        data =
          JSON.parse(rawText);

      }catch(e){

        throw new Error(
          'Server ส่งข้อมูลกลับมาไม่ใช่ JSON'
        );

      }


      if(!response.ok){

        throw new Error(
          data?.error ||
          `HTTP ${response.status}`
        );

      }


      if(!Array.isArray(data?.items)){

        throw new Error(
          'Server ไม่ส่งรายการ items กลับมา'
        );

      }


      return data.items;

    }catch(error){

      if(error.name === 'AbortError'){

        throw new Error(
          `คอลัมน์ที่ ${columnIndex + 1} ใช้เวลานานเกินไป`
        );

      }

      throw error;

    }finally{

      clearTimeout(timeout);

    }

  }


  /* =========================================================
     NORMALIZE ITEM
  ========================================================= */

  function normalizeItem(item){

    if(!item){
      return null;
    }


    let seq =
      item.seq ??
      item.sequence;


    let tracking =
      item.tracking ??
      item.tracking_number;


    if(seq === undefined || seq === null){
      return null;
    }


    seq =
      parseInt(
        String(seq).replace(/\D/g, ''),
        10
      );


    if(!Number.isFinite(seq)){
      return null;
    }


    if(seq < 1 || seq > MAX_ITEMS){
      return null;
    }


    if(!tracking){
      return null;
    }


    tracking =
      String(tracking)
        .toUpperCase()
        .replace(/[\s-]/g, '');


    /*
      ตรวจ format:

      2 ตัวอักษร
      9 ตัวเลข
      TH
    */

    const match =
      tracking.match(
        /^([A-Z]{2})(\d{9})(TH)?$/
      );


    if(!match){
      return null;
    }


    const letters =
      match[1];


    const digits =
      match[2];


    return {

      seq,

      tracking:
        letters +
        digits +
        'TH'

    };

  }


  /* =========================================================
     COMBINE ITEMS
  ========================================================= */

  function combineItems(all){

    const map =
      new Map();


    for(const raw of all){

      const item =
        normalizeItem(raw);


      if(!item){
        continue;
      }


      /*
        ถ้า sequence ซ้ำ
        เก็บรายการแรก
      */

      if(!map.has(item.seq)){

        map.set(
          item.seq,
          item
        );

      }

    }


    return Array
      .from(map.values())
      .sort(
        (a,b) =>
          a.seq - b.seq
      )
      .slice(0, MAX_ITEMS);

  }


  /* =========================================================
     READ SHEET
  ========================================================= */

  async function readSheet(){

    if(!currentFile){

      throw new Error(
        'กรุณาเลือกรูปภาพก่อน'
      );

    }


    progressWrap.style.display =
      'block';


    status.style.display =
      'none';


    progressBar.style.width =
      '2%';


    progressText.textContent =
      'กำลังเตรียมภาพ...';


    const {
      images,
      mediaType
    } =
      await normalizeImage(
        currentFile
      );


    let allItems = [];


    /*
      OCR ทีละ 4 คอลัมน์

      ไม่ยิงพร้อมกัน
      เพื่อให้ Gemini free tier
      มีโอกาสทำงานเสถียรกว่า
    */

    for(
      let columnIndex = 0;
      columnIndex < 4;
      columnIndex++
    ){

      const columnNumber =
        columnIndex + 1;


      progressText.textContent =
        `กำลังอ่านคอลัมน์ ${columnNumber} / 4...`;


      /*
        5 - 95%
      */

      const startProgress =
        5 +
        columnIndex * 23;


      progressBar.style.width =
        `${startProgress}%`;


      const items =
        await extractColumn(
          images[columnIndex],
          mediaType,
          columnIndex
        );


      allItems =
        allItems.concat(items);


      /*
        อัปเดตจำนวนที่อ่านได้ทันที
      */

      const combined =
        combineItems(
          allItems
        );


      countValue.textContent =
        combined.length;


      progressBar.style.width =
        `${startProgress + 20}%`;

    }


    /*
      รวมผลทั้งหมด
    */

    currentItems =
      combineItems(
        allItems
      );


    /*
      จบ
    */

    progressBar.style.width =
      '100%';


    progressText.textContent =
      'อ่านเสร็จแล้ว';


    countValue.textContent =
      currentItems.length;


    renderResults(
      currentItems
    );


    status.style.display =
      'block';


    status.className =
      'status';


    status.textContent =
      `อ่านเสร็จแล้ว พบ ${currentItems.length} รายการ`;


    searchCount.textContent =
      `ทั้งหมด ${currentItems.length} รายการ`;

  }


  /* =========================================================
     READ BUTTON
  ========================================================= */

  readButton.addEventListener(
    'click',
    async function(){

      if(!currentFile){
        return;
      }


      readButton.disabled =
        true;


      try{

        await readSheet();

      }catch(error){

        console.error(error);


        status.style.display =
          'block';


        status.className =
          'status error';


        status.textContent =
          'อ่านไม่สำเร็จ: ' +
          (
            error.message ||
            'เกิดข้อผิดพลาด'
          );


        progressText.textContent =
          'เกิดข้อผิดพลาด';


      }finally{

        readButton.disabled =
          false;

      }

    }
  );


  /* =========================================================
     ALL ITEMS
  ========================================================= */

  function allItems(){

    return currentItems.map(item => ({

      seq:
        item.seq ??
        item.sequence,

      tracking:
        item.tracking ??
        item.tracking_number

    }));

  }


  /* =========================================================
     DIGITS ONLY
  ========================================================= */

  function digitsOnly(value){

    return String(value || '')
      .replace(/\D/g, '');

  }


  /* =========================================================
     ESCAPE HTML
  ========================================================= */

  function escapeHtml(value){

    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  /* =========================================================
     HIGHLIGHT
  ========================================================= */

  function highlightMatch(
    tracking,
    query
  ){

    const text =
      String(tracking || '');


    const q =
      String(query || '')
        .trim()
        .toUpperCase();


    if(!q){
      return escapeHtml(text);
    }


    /*
      ถ้าค้นด้วยเลขอย่างเดียว
      ให้ highlight เฉพาะเลข
    */

    if(/^\d+$/.test(q)){

      const escaped =
        escapeHtml(text);


      const digitRegex =
        new RegExp(
          q,
          'g'
        );


      return escaped.replace(
        digitRegex,
        '<span class="highlight">$&</span>'
      );

    }


    /*
      ค้น tracking เต็ม
    */

    const escaped =
      escapeHtml(text);


    const escapedQuery =
      escapeHtml(q);


    const index =
      escaped
        .toUpperCase()
        .indexOf(
          escapedQuery
        );


    if(index === -1){

      return escaped;

    }


    return (
      escaped.slice(0, index) +
      '<span class="highlight">' +
      escaped.slice(
        index,
        index + escapedQuery.length
      ) +
      '</span>' +
      escaped.slice(
        index + escapedQuery.length
      )
    );

  }


  /* =========================================================
     RENDER RESULTS
  ========================================================= */

  function renderResults(
    items,
    query = ''
  ){

    if(!items.length){

      results.innerHTML =
        '<div class="empty">ไม่พบข้อมูล</div>';

      return;

    }


    results.innerHTML =
      items.map(item => {

        const seq =
          item.seq ??
          item.sequence;


        const tracking =
          item.tracking ??
          item.tracking_number ??
          '';


        return `
          <div class="result-item">

            <div class="result-seq">
              #${escapeHtml(seq)}
            </div>

            <div class="result-tracking">
              ${highlightMatch(
                tracking,
                query
              )}
            </div>

          </div>
        `;

      }).join('');

  }


  /* =========================================================
     SEARCH
  ========================================================= */

  function runSearch(){

    const query =
      searchInput.value.trim();


    const items =
      allItems();


    if(!query){

      searchCount.textContent =
        `ทั้งหมด ${items.length} รายการ`;

      renderResults(
        items
      );

      return;

    }


    const qUpper =
      query.toUpperCase();


    const qDigits =
      digitsOnly(query);


    const filtered =
      items.filter(item => {

        const tracking =
          String(
            item.tracking || ''
          ).toUpperCase();


        /*
          ค้น tracking เต็ม
        */

        if(
          tracking.includes(
            qUpper
          )
        ){

          return true;

        }


        /*
          ค้นเฉพาะตัวเลข
        */

        if(
          qDigits &&
          digitsOnly(
            tracking
          ).includes(
            qDigits
          )
        ){

          return true;

        }


        return false;

      });


    searchCount.textContent =
      `พบ ${filtered.length} รายการ`;


    renderResults(
      filtered,
      query
    );

  }


  searchButton.addEventListener(
    'click',
    runSearch
  );


  searchInput.addEventListener(
    'keydown',
    function(event){

      if(event.key === 'Enter'){

        runSearch();

      }

    }
  );


</script>
