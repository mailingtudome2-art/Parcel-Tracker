<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ป.303 SCANNER</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;
      background:#f3f8f4;
      color:#1f2937;
    }

    .container{
      width:min(1100px, 94%);
      margin:30px auto;
    }

    .card{
      background:#ffffff;
      border-radius:18px;
      padding:24px;
      box-shadow:
        0 8px 30px rgba(0,0,0,.08);
      margin-bottom:20px;
    }

    h1{
      margin:0 0 8px;
      color:#16834b;
      font-size:30px;
    }

    .subtitle{
      color:#6b7280;
      margin-bottom:20px;
    }

    .upload-box{
      border:2px dashed #72c59a;
      background:#f4fff8;
      border-radius:16px;
      padding:30px;
      text-align:center;
      cursor:pointer;
      transition:.2s;
    }

    .upload-box:hover{
      background:#ebfff2;
      border-color:#16834b;
    }

    .upload-box input{
      display:none;
    }

    .upload-icon{
      font-size:42px;
      margin-bottom:10px;
    }

    .upload-title{
      font-size:19px;
      font-weight:bold;
      color:#16834b;
    }

    .upload-subtitle{
      color:#6b7280;
      margin-top:6px;
    }

    button{
      border:0;
      border-radius:10px;
      padding:11px 18px;
      font-size:15px;
      cursor:pointer;
      font-weight:bold;
    }

    .btn-primary{
      background:#16834b;
      color:white;
    }

    .btn-primary:hover{
      background:#116b3d;
    }

    .btn-secondary{
      background:#e7f5ec;
      color:#16834b;
    }

    .btn-danger{
      background:#fee2e2;
      color:#b91c1c;
    }

    button:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:18px;
    }

    .status{
      margin-top:18px;
      padding:13px 15px;
      border-radius:10px;
      background:#f0fdf4;
      color:#166534;
      display:none;
      white-space:pre-wrap;
    }

    .status.error{
      background:#fef2f2;
      color:#b91c1c;
    }

    .status.show{
      display:block;
    }

    .progress-wrap{
      margin-top:16px;
      display:none;
    }

    .progress-wrap.show{
      display:block;
    }

    .progress-bar{
      width:100%;
      height:12px;
      background:#e5e7eb;
      border-radius:20px;
      overflow:hidden;
    }

    .progress-inner{
      width:0%;
      height:100%;
      background:#16834b;
      transition:width .25s;
    }

    .progress-text{
      margin-top:8px;
      font-size:14px;
      color:#6b7280;
    }

    .summary{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-bottom:18px;
    }

    .stat{
      flex:1;
      min-width:160px;
      background:#f4fff8;
      border:1px solid #d9f1e1;
      border-radius:12px;
      padding:15px;
    }

    .stat-label{
      font-size:13px;
      color:#6b7280;
    }

    .stat-value{
      margin-top:5px;
      font-size:25px;
      font-weight:bold;
      color:#16834b;
    }

    .search-row{
      display:flex;
      gap:10px;
      margin-bottom:18px;
    }

    .search-row input{
      flex:1;
      min-width:0;
      padding:13px 14px;
      border:1px solid #d1d5db;
      border-radius:10px;
      font-size:16px;
      outline:none;
    }

    .search-row input:focus{
      border-color:#16834b;
      box-shadow:
        0 0 0 3px rgba(22,131,75,.1);
    }

    .result{
      border:1px solid #e5e7eb;
      border-radius:12px;
      padding:14px 16px;
      margin-bottom:10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      background:#fff;
    }

    .result-left{
      min-width:0;
    }

    .seq{
      display:inline-block;
      min-width:45px;
      font-weight:bold;
      color:#16834b;
    }

    .tracking{
      font-size:18px;
      font-weight:bold;
      letter-spacing:.5px;
      word-break:break-all;
    }

    .sheet-name{
      font-size:12px;
      color:#9ca3af;
      margin-top:5px;
    }

    .empty{
      text-align:center;
      color:#9ca3af;
      padding:30px 10px;
    }

    .loading{
      text-align:center;
      padding:20px;
      color:#16834b;
      font-weight:bold;
    }

    .small{
      font-size:13px;
      color:#6b7280;
    }

    @media(max-width:650px){

      .container{
        width:94%;
        margin:15px auto;
      }

      .card{
        padding:17px;
      }

      h1{
        font-size:25px;
      }

      .search-row{
        flex-direction:column;
      }

      .search-row button{
        width:100%;
      }

      .result{
        align-items:flex-start;
      }

    }

  </style>
</head>


<body>

<div class="container">

  <!-- ==================================================
       HEADER
       ================================================== -->

  <div class="card">

    <h1>📦 ป.303 SCANNER</h1>

    <div class="subtitle">
      ระบบอ่านเลขพัสดุจากบัญชีนำจ่าย ป.303
    </div>


    <!-- ==================================================
         UPLOAD
         ================================================== -->

    <label
      class="upload-box"
      for="fileInput"
    >

      <div class="upload-icon">
        📷
      </div>

      <div class="upload-title">
        เลือกรูปภาพ ป.303
      </div>

      <div class="upload-subtitle">
        รองรับ JPG / JPEG / PNG
      </div>

      <input
        id="fileInput"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

    </label>


    <!-- ==================================================
         ACTION BUTTONS
         ================================================== -->

    <div class="actions">

      <button
        id="readBtn"
        class="btn-primary"
        disabled
      >
        🔍 อ่านเลขพัสดุ
      </button>

      <button
        id="clearBtn"
        class="btn-secondary"
      >
        ล้างข้อมูล
      </button>

    </div>


    <!-- ==================================================
         PROGRESS
         ================================================== -->

    <div
      id="progressWrap"
      class="progress-wrap"
    >

      <div class="progress-bar">

        <div
          id="progressInner"
          class="progress-inner"
        ></div>

      </div>

      <div
        id="progressText"
        class="progress-text"
      >
        กำลังเตรียมรูปภาพ...
      </div>

    </div>


    <!-- ==================================================
         STATUS
         ================================================== -->

    <div
      id="status"
      class="status"
    ></div>

  </div>


  <!-- ==================================================
       RESULTS
       ================================================== -->

  <div
    id="resultCard"
    class="card"
    style="display:none;"
  >

    <div class="summary">

      <div class="stat">

        <div class="stat-label">
          จำนวนที่อ่านได้
        </div>

        <div
          id="countValue"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          สูงสุดที่รองรับ
        </div>

        <div class="stat-value">
          100
        </div>

      </div>

    </div>


    <!-- ==================================================
         SEARCH
         ================================================== -->

    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        placeholder="ค้นหาเลขพัสดุ เช่น 7161 หรือ WB368998512TH"
      >

      <button
        id="searchBtn"
        class="btn-primary"
      >
        🔎 ค้นหา
      </button>

    </div>


    <div
      id="searchResult"
    ></div>


    <!-- ==================================================
         ALL ITEMS
         ================================================== -->

    <div
      id="allResult"
    ></div>

  </div>

</div>


<script>


// ======================================================
// Global variables
// ======================================================

let selectedFile = null;

let sheets = [];


// ======================================================
// DOM
// ======================================================

const fileInput =
  document.getElementById('fileInput');

const readBtn =
  document.getElementById('readBtn');

const clearBtn =
  document.getElementById('clearBtn');

const statusBox =
  document.getElementById('status');

const progressWrap =
  document.getElementById('progressWrap');

const progressInner =
  document.getElementById('progressInner');

const progressText =
  document.getElementById('progressText');

const resultCard =
  document.getElementById('resultCard');

const countValue =
  document.getElementById('countValue');

const searchInput =
  document.getElementById('searchInput');

const searchBtn =
  document.getElementById('searchBtn');

const searchResult =
  document.getElementById('searchResult');

const allResult =
  document.getElementById('allResult');


// ======================================================
// File selected
// ======================================================

fileInput.addEventListener(
  'change',
  () => {

    const file =
      fileInput.files?.[0];

    if(!file){
      selectedFile = null;
      readBtn.disabled = true;
      return;
    }

    selectedFile = file;

    readBtn.disabled = false;

    showStatus(
      'เลือกรูปแล้ว: ' + file.name,
      false
    );

  }
);


// ======================================================
// Status
// ======================================================

function showStatus(message, isError = false){

  statusBox.textContent =
    message || '';

  statusBox.className =
    'status show' +
    (isError ? ' error' : '');

}


// ======================================================
// Progress
// ======================================================

function setProgress(percent, text){

  progressWrap.classList.add('show');

  progressInner.style.width =
    Math.max(
      0,
      Math.min(100, percent)
    ) + '%';

  progressText.textContent =
    text || '';

}


// ======================================================
// Hide progress
// ======================================================

function hideProgress(){

  progressWrap.classList.remove('show');

}


// ======================================================
// Clear
// ======================================================

clearBtn.addEventListener(
  'click',
  () => {

    selectedFile = null;

    sheets = [];

    fileInput.value = '';

    readBtn.disabled = true;

    resultCard.style.display =
      'none';

    searchInput.value = '';

    searchResult.innerHTML =
      '';

    allResult.innerHTML =
      '';

    countValue.textContent =
      '0';

    statusBox.className =
      'status';

    statusBox.textContent =
      '';

    hideProgress();

  }
);


// ======================================================
// Read button
// ======================================================

readBtn.addEventListener(
  'click',
  async () => {

    if(!selectedFile){
      return;
    }

    readBtn.disabled = true;

    try{

      await processFile(
        selectedFile
      );

    }catch(error){

      console.error(error);

      showStatus(
        error?.message ||
        'เกิดข้อผิดพลาด',
        true
      );

    }finally{

      readBtn.disabled = false;

    }

  }
);


// ======================================================
// Load image
// ======================================================

function loadImage(file){

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      const url =
        URL.createObjectURL(file);


      img.onload =
        () => {

          URL.revokeObjectURL(url);

          resolve(img);

        };


      img.onerror =
        () => {

          URL.revokeObjectURL(url);

          reject(
            new Error(
              'ไม่สามารถเปิดรูปภาพได้'
            )
          );

        };


      img.src =
        url;

    }
  );

}


// ======================================================
// Normalize image
//
// แบ่งภาพออกเป็น 4 คอลัมน์
// เพื่อส่ง Gemini ทีละคอลัมน์
// ======================================================

async function normalizeImage(file){

  const img =
    await loadImage(file);


  const srcW =
    img.naturalWidth ||
    img.width;

  const srcH =
    img.naturalHeight ||
    img.height;


  if(
    !srcW ||
    !srcH
  ){

    throw new Error(
      'ไม่สามารถอ่านขนาดรูปภาพได้'
    );

  }


  // ----------------------------------------------------
  // Crop ส่วนตาราง ป.303
  // ----------------------------------------------------

  const cropX =
    Math.round(srcW * 0.070);

  const cropY =
    Math.round(srcH * 0.345);

  const cropW =
    Math.round(srcW * 0.820);

  const cropH =
    Math.round(srcH * 0.420);


  // ----------------------------------------------------
  // ช่องว่างระหว่างคอลัมน์
  // ----------------------------------------------------

  const colGap =
    Math.max(
      1,
      Math.round(cropW * 0.008)
    );


  const colW =
    Math.floor(
      (
        cropW -
        colGap * 3
      ) / 4
    );


  // ----------------------------------------------------
  // Scale
  // ----------------------------------------------------

  const scale =
    2.0;


  const images = [];


  // ----------------------------------------------------
  // ทำทีละ 4 คอลัมน์
  // ----------------------------------------------------

  for(
    let columnIndex = 0;
    columnIndex < 4;
    columnIndex++
  ){

    const sx =
      cropX +
      columnIndex *
      (colW + colGap);


    const sy =
      cropY;


    const sw =
      colW;


    const sh =
      cropH;


    const outputCanvas =
      document.createElement(
        'canvas'
      );


    outputCanvas.width =
      Math.max(
        1,
        Math.round(sw * scale)
      );


    outputCanvas.height =
      Math.max(
        1,
        Math.round(sh * scale)
      );


    const ctx =
      outputCanvas.getContext(
        '2d',
        {
          alpha:false
        }
      );


    ctx.imageSmoothingEnabled =
      true;


    ctx.imageSmoothingQuality =
      'high';


    ctx.drawImage(

      img,

      sx,
      sy,
      sw,
      sh,

      0,
      0,

      outputCanvas.width,
      outputCanvas.height

    );


    // --------------------------------------------------
    // JPEG 0.70
    // --------------------------------------------------

    const dataUrl =
      outputCanvas.toDataURL(
        'image/jpeg',
        0.70
      );


    images.push(
      dataUrl.split(',')[1]
    );

  }


  return {

    images,

    mediaType:
      'image/jpeg',

    dataUrl:
      null

  };

}


// ======================================================
// Extract sheet
//
// ส่ง Gemini ทีละคอลัมน์
// ไม่ส่ง 4 รูปพร้อมกัน
// ======================================================

async function extractSheet(
  images,
  mediaType
){

  const allItems = [];


  // ----------------------------------------------------
  // อ่านทีละคอลัมน์
  // ----------------------------------------------------

  for(
    let columnIndex = 0;
    columnIndex < images.length;
    columnIndex++
  ){

    setProgress(
      10 +
      (
        columnIndex /
        images.length
      ) * 75,

      'กำลังอ่านคอลัมน์ ' +
      (columnIndex + 1) +
      ' / ' +
      images.length +
      ' ...'
    );


    let response;


    try{

      response =
        await fetch(
          '/api/extract',
          {

            method:
              'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify({

                image:
                  images[columnIndex],

                mediaType:
                  mediaType ||
                  'image/jpeg',

                columnIndex

              })

          }
        );


    }catch(e){

      throw new Error(
        'เชื่อมต่อ /api/extract ไม่ได้: ' +
        (
          e.message ||
          ''
        )
      );

    }


    const raw =
      await response.text();


    console.log(
      'COLUMN',
      columnIndex + 1,
      'STATUS:',
      response.status
    );


    console.log(
      'COLUMN',
      columnIndex + 1,
      'RESPONSE:',
      raw
    );


    // --------------------------------------------------
    // Error
    // --------------------------------------------------

    if(!response.ok){

      if(
        response.status === 413
      ){

        throw new Error(
          'รูปคอลัมน์ที่ ' +
          (columnIndex + 1) +
          ' ใหญ่เกินไป (HTTP 413)'
        );

      }


      if(
        response.status === 429
      ){

        throw new Error(
          'Gemini จำกัดจำนวนคำขอชั่วคราว (HTTP 429)'
        );

      }


      if(
        response.status === 404
      ){

        throw new Error(
          'ไม่พบ /api/extract (HTTP 404)'
        );

      }


      if(
        response.status === 500
      ){

        throw new Error(
          'Server Error (HTTP 500): ' +
          raw.slice(0,500)
        );

      }


      throw new Error(
        'Server HTTP ' +
        response.status +
        ': ' +
        raw.slice(0,500)
      );

    }


    // --------------------------------------------------
    // JSON
    // --------------------------------------------------

    let data;


    try{

      data =
        JSON.parse(raw);

    }catch(e){

      throw new Error(
        'เซิร์ฟเวอร์ส่งข้อมูลไม่ใช่ JSON: ' +
        raw.slice(0,500)
      );

    }


    if(data.error){

      throw new Error(
        data.error
      );

    }


    // --------------------------------------------------
    // Items
    // --------------------------------------------------

    if(
      data.items &&
      Array.isArray(
        data.items
      )
    ){

      for(
        const it of data.items
      ){

        const tracking =
          (
            it.tracking ??
            it.tracking_number ??
            ''
          )
          .toString()
          .trim()
          .toUpperCase();


        const seq =
          it.seq ??
          it.sequence ??
          '';


        if(tracking){

          allItems.push({

            seq,

            tracking

          });

        }

      }

    }

  }


  // ====================================================
  // รวมรายการจาก 4 คอลัมน์
  // ====================================================

  const seenSeq =
    new Set();


  const seenTracking =
    new Set();


  const normalized = [];


  for(
    const item of allItems
  ){

    const seq =
      parseInt(
        item.seq,
        10
      );


    const tracking =
      item.tracking;


    if(
      !Number.isInteger(seq) ||
      seq < 1 ||
      seq > 100
    ){

      continue;

    }


    if(!tracking){

      continue;

    }


    if(
      seenSeq.has(seq)
    ){

      continue;

    }


    if(
      seenTracking.has(tracking)
    ){

      continue;

    }


    seenSeq.add(seq);

    seenTracking.add(
      tracking
    );


    normalized.push({

      seq,

      tracking

    });

  }


  // ----------------------------------------------------
  // เรียงตาม sequence
  // ----------------------------------------------------

  normalized.sort(
    (a,b) =>
      a.seq - b.seq
  );


  if(
    normalized.length === 0
  ){

    throw new Error(
      'อ่านเลขพัสดุไม่สำเร็จ — Gemini ไม่พบเลขที่ตรงรูปแบบ'
    );

  }


  console.log(
    'TOTAL OCR ITEMS:',
    normalized.length
  );


  return normalized;

}


// ======================================================
// Process file
// ======================================================

async function processFile(file){

  showStatus(
    'กำลังเตรียมรูปภาพ...',
    false
  );


  setProgress(
    5,
    'กำลังเตรียมรูปภาพ...'
  );


  // ----------------------------------------------------
  // Normalize
  // ----------------------------------------------------

  const {
    images,
    mediaType
  } =
    await normalizeImage(
      file
    );


  if(
    !images ||
    !images.length
  ){

    throw new Error(
      'ไม่สามารถแบ่งภาพเป็นคอลัมน์ได้'
    );

  }


  // ----------------------------------------------------
  // OCR
  // ----------------------------------------------------

  const items =
    await extractSheet(
      images,
      mediaType
    );


  // ----------------------------------------------------
  // Save
  // ----------------------------------------------------

  sheets = [

    {

      name:
        file.name,

      items

    }

  ];


  // ----------------------------------------------------
  // Finish
  // ----------------------------------------------------

  setProgress(
    100,
    'อ่านเสร็จแล้ว'
  );


  showStatus(
    'อ่านเสร็จแล้ว พบ ' +
    items.length +
    ' รายการ',
    false
  );


  renderResults();


  setTimeout(
    () => {
      hideProgress();
    },
    700
  );

}


// ======================================================
// Get all items
// ======================================================

function allItems(){

  const result = [];


  for(
    const sheet of sheets
  ){

    for(
      const it of (
        sheet.items || []
      )
    ){

      const tracking =
        (
          it.tracking ||
          it.tracking_number ||
          ''
        )
        .toString()
        .trim()
        .toUpperCase();


      const seq =
        it.seq ??
        it.sequence ??
        '';


      if(!tracking){

        continue;

      }


      result.push({

        seq,

        tracking,

        sheetName:
          sheet.name

      });

    }

  }


  return result;

}


// ======================================================
// Render results
// ======================================================

function renderResults(){

  const items =
    allItems();


  resultCard.style.display =
    'block';


  countValue.textContent =
    items.length;


  searchResult.innerHTML =
    '';


  renderAllItems(
    items
  );

}


// ======================================================
// Render all items
// ======================================================

function renderAllItems(
  items
){

  if(!items.length){

    allResult.innerHTML = `
      <div class="empty">
        ยังไม่มีข้อมูล
      </div>
    `;

    return;

  }


  let html = '';


  for(
    const item of items
  ){

    html += `

      <div class="result">

        <div class="result-left">

          <div>

            <span class="seq">
              #${escapeHtml(
                item.seq
              )}
            </span>

            <span class="tracking">
              ${escapeHtml(
                item.tracking
              )}
            </span>

          </div>

          <div class="sheet-name">
            ${escapeHtml(
              item.sheetName
            )}
          </div>

        </div>

      </div>

    `;

  }


  allResult.innerHTML =
    html;

}


// ======================================================
// Search button
// ======================================================

searchBtn.addEventListener(
  'click',
  runSearch
);


// ======================================================
// Search Enter
// ======================================================

searchInput.addEventListener(
  'keydown',
  event => {

    if(
      event.key === 'Enter'
    ){

      runSearch();

    }

  }
);


// ======================================================
// Search
// ======================================================

function runSearch(){

  const query =
    searchInput.value
      .trim()
      .toUpperCase();


  if(!query){

    searchResult.innerHTML =
      '';

    renderAllItems(
      allItems()
    );

    return;

  }


  const items =
    allItems();


  const numericQuery =
    digitsOnly(
      query
    );


  const matches =
    items.filter(
      item => {

        const tracking =
          item.tracking
            .toUpperCase();


        const numericTracking =
          digitsOnly(
            tracking
          );


        // ------------------------------------------------
        // รองรับ:
        // 7161
        // WB368998512TH
        // WB 3689...
        // ------------------------------------------------

        return (

          tracking.includes(
            query
          )

          ||

          (
            numericQuery &&
            numericTracking.includes(
              numericQuery
            )
          )

        );

      }
    );


  if(!matches.length){

    searchResult.innerHTML = `

      <div class="empty">

        ไม่พบเลขพัสดุ
        <br>

        <span class="small">
          ค้นหา: ${escapeHtml(query)}
        </span>

      </div>

    `;

    return;

  }


  let html = `

    <div
      class="small"
      style="margin-bottom:10px;"
    >
      พบ ${matches.length} รายการ
    </div>

  `;


  for(
    const item of matches
  ){

    html += `

      <div class="result">

        <div class="result-left">

          <div>

            <span class="seq">
              #${escapeHtml(
                item.seq
              )}
            </span>

            <span class="tracking">
              ${highlightMatch(
                item.tracking,
                query
              )}
            </span>

          </div>

          <div class="sheet-name">
            ${escapeHtml(
              item.sheetName
            )}
          </div>

        </div>

      </div>

    `;

  }


  searchResult.innerHTML =
    html;

}


// ======================================================
// Digits only
// ======================================================

function digitsOnly(value){

  return String(
    value || ''
  ).replace(
    /[^0-9]/g,
    ''
  );

}


// ======================================================
// Highlight search
// ======================================================

function highlightMatch(
  tracking,
  query
){

  const safeTracking =
    escapeHtml(
      tracking
    );


  const safeQuery =
    escapeHtml(
      query
    );


  // Full tracking search
  if(
    query &&
    tracking.includes(
      query
    )
  ){

    return safeTracking.replace(
      new RegExp(
        escapeRegex(
          safeQuery
        ),
        'gi'
      ),
      match =>
        `<mark>${match}</mark>`
    );

  }


  // Numeric search
  const digits =
    digitsOnly(
      query
    );


  if(!digits){

    return safeTracking;

  }


  // Highlight digits inside tracking
  const pattern =
    new RegExp(
      escapeRegex(
        digits
      ),
      'g'
    );


  return safeTracking.replace(
    pattern,
    match =>
      `<mark>${match}</mark>`
  );

}


// ======================================================
// Escape regex
// ======================================================

function escapeRegex(
  value
){

  return String(
    value || ''
  ).replace(
    /[.*+?^${}()|[\]\\]/g,
    '\\$&'
  );

}


// ======================================================
// Escape HTML
// ======================================================

function escapeHtml(
  value
){

  return String(
    value ?? ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


</script>
