<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ป.303 SCANNER</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans Thai", sans-serif;
  background: #f4fbf6;
  color: #173b2a;
}

.wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

.card {
  background: #fff;
  border: 1px solid #d7eadc;
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 4px 18px rgba(0,0,0,.05);
  margin-bottom: 16px;
}

h1 {
  margin: 0 0 6px;
  font-size: 28px;
  color: #138a4b;
}

.sub {
  color: #557363;
  margin-bottom: 16px;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 16px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

#readBtn {
  background: #138a4b;
  color: white;
}

#clearBtn {
  background: #e8f4ec;
  color: #17663a;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

input[type="file"] {
  width: 100%;
}

.search {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #c9dfcf;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

.progress {
  height: 12px;
  background: #e6f0e9;
  border-radius: 99px;
  overflow: hidden;
  margin: 12px 0;
}

.bar {
  height: 100%;
  width: 0;
  background: #1aa15a;
  transition: width .25s;
}

.status {
  font-size: 14px;
  color: #4b6556;
  min-height: 22px;
}

.stats {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 15px;
  margin-top: 8px;
}

.stats b {
  color: #138a4b;
}

#preview {
  max-width: 100%;
  max-height: 500px;
  display: none;
  margin-top: 12px;
  border-radius: 10px;
  border: 1px solid #d7eadc;
}

.results {
  margin-top: 14px;
}

.item {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid #edf3ee;
  font-size: 14px;
}

.seq {
  width: 52px;
  color: #557363;
}

.trk {
  font-weight: 700;
  letter-spacing: .4px;
}

.ok,
.warn,
.err {
  border-radius: 10px;
  padding: 10px;
  margin-top: 10px;
  font-size: 14px;
}

.ok {
  background: #eaf8ef;
  border: 1px solid #bfe3ca;
  color: #17663a;
}

.warn {
  background: #fff7df;
  border: 1px solid #f0d78a;
  color: #775b13;
}

.err {
  background: #fff0f0;
  border: 1px solid #efc1c1;
  color: #9a2525;
}

.log {
  font-size: 12px;
  color: #71877a;
  white-space: pre-wrap;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>ป.303 SCANNER</h1>

    <div class="sub">
      อ่านเลขพัสดุจากบัญชีนำจ่ายด้วย Gemini
    </div>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
    >

    <img
      id="preview"
      alt="ตัวอย่างรูป"
    >

    <div class="row" style="margin-top:14px">

      <button id="readBtn" disabled>
        อ่านเลขพัสดุ
      </button>

      <button id="clearBtn">
        ล้าง
      </button>

    </div>

    <div class="progress">
      <div id="bar" class="bar"></div>
    </div>

    <div id="status" class="status">
      กรุณาเลือกรูป
    </div>

    <div class="stats">

      <div>
        จำนวนที่อ่านได้:
        <b id="count">0</b>
      </div>

      <div>
        จำนวนทั้งหมดในใบ:
        <b id="sheetTotal">-</b>
      </div>

      <div>
        ความคืบหน้า:
        <b id="pct">0%</b>
      </div>

    </div>

    <div id="message"></div>

  </div>


  <div class="card">

    <input
      id="searchInput"
      class="search"
      placeholder="พิมพ์เลขเพื่อค้นหา เช่น 4914"
    >

    <div id="results" class="results"></div>

  </div>


  <div class="card">

    <div id="log" class="log"></div>

  </div>

</div>


<script>

const fileInput =
  document.getElementById("fileInput");

const preview =
  document.getElementById("preview");

const readBtn =
  document.getElementById("readBtn");

const clearBtn =
  document.getElementById("clearBtn");

const bar =
  document.getElementById("bar");

const statusEl =
  document.getElementById("status");

const countEl =
  document.getElementById("count");

const totalEl =
  document.getElementById("sheetTotal");

const pctEl =
  document.getElementById("pct");

const resultsEl =
  document.getElementById("results");

const searchInput =
  document.getElementById("searchInput");

const messageEl =
  document.getElementById("message");

const logEl =
  document.getElementById("log");


let originalDataUrl = "";

let originalMediaType = "image/jpeg";

let all = [];

let busy = false;


/* =========================
   UI
========================= */

function setProgress(percent, text = "") {

  const n =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(percent)
      )
    );

  bar.style.width = n + "%";

  pctEl.textContent =
    n + "%";

  if (text) {
    statusEl.textContent = text;
  }
}


function setMessage(type, text) {

  messageEl.className =
    type || "";

  messageEl.textContent =
    text || "";
}


/* =========================
   Tracking
========================= */

function digitsOnly(value) {

  return String(value || "")
    .replace(/[^0-9]/g, "");
}


function normalizeTracking(value) {

  let s =
    String(value || "")
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "");

  /*
   * บางครั้ง Gemini อาจตัด TH ออก
   */
  if (/^[A-Z]{2}[0-9]{9}$/.test(s)) {
    s += "TH";
  }

  if (
    !/^[A-Z]{2}[0-9]{9}TH$/.test(s)
  ) {
    return "";
  }

  return s;
}


/* =========================
   Items
========================= */

function normalizeItems(items) {

  const map = new Map();

  if (!Array.isArray(items)) {
    return [];
  }

  for (const item of items) {

    const seq =
      Number(
        item?.seq ??
        item?.sequence
      );

    const tracking =
      normalizeTracking(
        item?.tracking ??
        item?.tracking_number
      );

    if (
      !Number.isInteger(seq) ||
      seq < 1 ||
      seq > 100
    ) {
      continue;
    }

    if (!tracking) {
      continue;
    }

    map.set(
      seq,
      {
        seq,
        tracking
      }
    );
  }

  return [...map.values()]
    .sort((a, b) => a.seq - b.seq);
}


function mergeItems(items) {

  const map =
    new Map(
      all.map(item => [
        item.seq,
        item
      ])
    );

  for (
    const item
    of normalizeItems(items)
  ) {

    map.set(
      item.seq,
      item
    );
  }

  all =
    [...map.values()]
      .sort(
        (a, b) =>
          a.seq - b.seq
      );

  render();
}


/* =========================
   Render
========================= */

function render() {

  countEl.textContent =
    all.length;

  const q =
    searchInput.value
      .trim()
      .toUpperCase();

  let list = all;

  if (q) {

    const digits =
      digitsOnly(q);

    list =
      all.filter(item => {

        if (
          item.tracking.includes(q)
        ) {
          return true;
        }

        if (
          digits &&
          digitsOnly(
            item.tracking
          ).includes(digits)
        ) {
          return true;
        }

        return false;
      });
  }

  if (!list.length) {

    resultsEl.innerHTML =
      '<div style="padding:12px;color:#71877a">ไม่พบข้อมูล</div>';

    return;
  }

  resultsEl.innerHTML =
    list.map(item => {

      return `
        <div class="item">
          <span class="seq">
            #${item.seq}
          </span>

          <span class="trk">
            ${item.tracking}
          </span>
        </div>
      `;

    }).join("");
}


searchInput.addEventListener(
  "input",
  render
);


/* =========================
   File
========================= */

fileInput.addEventListener(
  "change",
  async () => {

    const file =
      fileInput.files?.[0];

    if (!file) {
      return;
    }

    originalMediaType =
      file.type ||
      "image/jpeg";

    originalDataUrl =
      await readFileAsDataURL(file);

    preview.src =
      originalDataUrl;

    preview.style.display =
      "block";

    readBtn.disabled =
      false;

    all = [];

    render();

    totalEl.textContent =
      "-";

    setProgress(
      0,
      "พร้อมอ่าน"
    );

    setMessage(
      "",
      ""
    );

    logEl.textContent =
      "";
  }
);


function readFileAsDataURL(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(file);
    }
  );
}


/* =========================
   Data URL
========================= */

function dataUrlParts(dataUrl) {

  const match =
    String(dataUrl).match(
      /^data:([^;]+);base64,(.*)$/s
    );

  if (!match) {
    throw new Error(
      "รูปภาพไม่ถูกต้อง"
    );
  }

  return {
    mediaType:
      match[1] ||
      "image/jpeg",

    image:
      match[2]
  };
}


/* =========================
   Crop
========================= */

function cropImage(
  dataUrl,
  x,
  y,
  w,
  h,
  scale = 2.0,
  quality = 0.68
) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      img.onload = () => {

        const sx =
          Math.max(
            0,
            Math.round(
              x * img.naturalWidth
            )
          );

        const sy =
          Math.max(
            0,
            Math.round(
              y * img.naturalHeight
            )
          );

        const sw =
          Math.min(
            img.naturalWidth - sx,
            Math.round(
              w * img.naturalWidth
            )
          );

        const sh =
          Math.min(
            img.naturalHeight - sy,
            Math.round(
              h * img.naturalHeight
            )
          );

        const canvas =
          document.createElement(
            "canvas"
          );

        canvas.width =
          Math.max(
            1,
            Math.round(
              sw * scale
            )
          );

        canvas.height =
          Math.max(
            1,
            Math.round(
              sh * scale
            )
          );

        const ctx =
          canvas.getContext(
            "2d"
          );

        ctx.imageSmoothingEnabled =
          true;

        ctx.drawImage(
          img,
          sx,
          sy,
          sw,
          sh,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const output =
          canvas.toDataURL(
            "image/jpeg",
            quality
          );

        resolve(
          dataUrlParts(output)
        );
      };

      img.onerror =
        () => reject(
          new Error(
            "โหลดรูปไม่สำเร็จ"
          )
        );

      img.src =
        dataUrl;
    }
  );
}


/* =========================
   Make 4 columns
========================= */

async function makeColumns() {

  const img =
    new Image();

  img.src =
    originalDataUrl;

  await new Promise(
    (resolve, reject) => {

      img.onload =
        resolve;

      img.onerror =
        () => reject(
          new Error(
            "โหลดรูปไม่สำเร็จ"
          )
        );
    }
  );

  const srcW =
    img.naturalWidth;

  const srcH =
    img.naturalHeight;


  /*
   * ตำแหน่งเดิมของระบบ
   */
  const cropX =
    Math.round(
      srcW * 0.065
    );

  const cropY =
    Math.round(
      srcH * 0.285
    );

  const cropW =
    Math.round(
      srcW * 0.855
    );

  const cropH =
    Math.round(
      srcH * 0.635
    );


  const safeW =
    cropW;

  const gap =
    Math.max(
      2,
      Math.round(
        safeW * 0.009
      )
    );

  const colW =
    Math.floor(
      (
        safeW -
        gap * 3
      ) / 4
    );


  const columns = [];


  for (
    let i = 0;
    i < 4;
    i++
  ) {

    const x =
      cropX +
      i * (colW + gap);

    const column =
      await cropImage(
        originalDataUrl,

        x / srcW,
        cropY / srcH,

        colW / srcW,
        cropH / srcH,

        2.0,
        0.68
      );

    columns.push(
      column
    );
  }


  return columns;
}


/* =========================
   Detect total
========================= */

async function detectSheetTotal() {

  /*
   * อ่านเฉพาะส่วนหัว
   * เพื่อหา "จำนวน 82 ชิ้น"
   */

  const head =
    await cropImage(
      originalDataUrl,

      0.03,
      0.00,
      0.94,
      0.31,

      1.5,
      0.70
    );


  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      30000
    );


  try {

    const response =
      await fetch(
        "/api/extract",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              image:
                head.image,

              mediaType:
                head.mediaType,

              mode:
                "detect_total"
            }),

          signal:
            controller.signal
        }
      );


    const raw =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(raw);

    } catch {

      throw new Error(
        `Server ตอบกลับไม่ใช่ JSON (HTTP ${response.status})`
      );
    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        `ตรวจจำนวนรวมไม่สำเร็จ (HTTP ${response.status})`
      );
    }


    const total =
      Number(data.total);


    if (
      !Number.isInteger(total) ||
      total < 1 ||
      total > 100
    ) {

      throw new Error(
        "อ่านจำนวนทั้งหมดในใบไม่สำเร็จ"
      );
    }


    return total;

  } finally {

    clearTimeout(timer);
  }
}


/* =========================
   Call column
========================= */

async function callColumn(
  column,
  columnIndex
) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      35000
    );


  try {

    const response =
      await fetch(
        "/api/extract",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              image:
                column.image,

              mediaType:
                column.mediaType ||
                "image/jpeg",

              columnIndex,

              sheetTotal:
                Number(
                  totalEl.textContent
                )

            }),

          signal:
            controller.signal
        }
      );


    const raw =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(raw);

    } catch {

      throw new Error(
        `Server ตอบกลับไม่ใช่ JSON (HTTP ${response.status})`
      );
    }


    if (!response.ok) {

      let detail = "";

      if (data.details) {

        detail =
          `: ${data.details}`;
      }

      throw new Error(
        (
          data.error ||
          `HTTP ${response.status}`
        ) + detail
      );
    }


    return data;

  } catch (error) {

    if (
      error.name ===
      "AbortError"
    ) {

      throw new Error(
        "หมดเวลา 35 วินาที"
      );
    }

    throw error;

  } finally {

    clearTimeout(timer);
  }
}


/* =========================
   Expected sequences
========================= */

function expectedForColumn(
  columnIndex,
  total
) {

  const result = [];

  for (
    let seq = columnIndex + 1;
    seq <= total;
    seq += 4
  ) {

    result.push(seq);
  }

  return result;
}


/* =========================
   Missing
========================= */

function missingForColumn(
  items,
  columnIndex,
  total
) {

  const expected =
    expectedForColumn(
      columnIndex,
      total
    );

  const got =
    new Set(
      normalizeItems(items)
        .map(item => item.seq)
    );


  return expected.filter(
    seq => !got.has(seq)
  );
}


/* =========================
   Read one column
   IMPORTANT:
   NEVER SKIP
========================= */

async function readOneColumnUntilComplete(
  column,
  columnIndex,
  total
) {

  const expected =
    expectedForColumn(
      columnIndex,
      total
    );


  let lastError =
    "";


  /*
   * ถ้าไม่ครบ จะอยู่คอลัมน์เดิม
   * ไม่ข้ามไปคอลัมน์ถัดไป
   */

  for (
    let attempt = 1;
    attempt <= 4;
    attempt++
  ) {

    statusEl.textContent =
      `กำลังอ่านคอลัมน์ ${columnIndex + 1}/4 ครั้งที่ ${attempt}/4`;


    try {

      const data =
        await callColumn(
          column,
          columnIndex
        );


      const items =
        normalizeItems(
          data.items
        );


      const missing =
        missingForColumn(
          items,
          columnIndex,
          total
        );


      /*
       * ครบแล้วเท่านั้น
       * จึงถือว่าคอลัมน์สำเร็จ
       */

      if (
        missing.length === 0
      ) {

        logEl.textContent +=
          `คอลัมน์ ${columnIndex + 1}: สำเร็จ ${items.length}/${expected.length}\n`;

        return items;
      }


      lastError =
        `คอลัมน์ ${columnIndex + 1}: ได้ ${items.length}/${expected.length} รายการ — ขาด #${missing.join(", #")}`;


      logEl.textContent +=
        lastError + "\n";


      /*
       * ไม่ return
       * ไม่ continue ไปคอลัมน์ถัดไป
       *
       * วนกลับมาอ่านคอลัมน์เดิม
       */

    } catch (error) {

      lastError =
        `คอลัมน์ ${columnIndex + 1}: ครั้งที่ ${attempt}/4 ERROR — ${error.message}`;


      logEl.textContent +=
        lastError + "\n";


      /*
       * Error ก็ยังอยู่คอลัมน์เดิม
       */
    }


    /*
     * เว้นนิดหนึ่งก่อน retry
     */

    if (attempt < 4) {

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            1200
          )
      );
    }
  }


  /*
   * ครบ 4 ครั้งแล้วยังไม่ผ่าน
   *
   * หยุดทั้งงาน
   * ห้ามข้าม
   */

  throw new Error(
    lastError ||
    `คอลัมน์ ${columnIndex + 1} ยังอ่านไม่ครบ`
  );
}


/* =========================
   MAIN
========================= */

readBtn.addEventListener(
  "click",
  async () => {

    if (
      busy ||
      !originalDataUrl
    ) {
      return;
    }


    busy = true;

    readBtn.disabled =
      true;

    clearBtn.disabled =
      true;


    all = [];

    render();

    setMessage(
      "",
      ""
    );

    logEl.textContent =
      "";


    try {

      /* ---------------------
         1. Detect total
      --------------------- */

      setProgress(
        3,
        "กำลังตรวจจำนวนทั้งหมดในใบ..."
      );


      let total = null;


      /*
       * จำนวนรวมสำคัญมาก
       * ถ้าอ่านไม่ได้ ห้ามเดา
       */

      for (
        let attempt = 1;
        attempt <= 4 &&
        total === null;
        attempt++
      ) {

        try {

          total =
            await detectSheetTotal();

        } catch (error) {

          logEl.textContent +=
            `ตรวจจำนวนรวม ครั้งที่ ${attempt}/4: ${error.message}\n`;


          if (
            attempt < 4
          ) {

            await new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  1200
                )
            );
          }
        }
      }


      if (
        total === null
      ) {

        throw new Error(
          "ตรวจจำนวนทั้งหมดในใบไม่สำเร็จ จึงหยุดเพื่อป้องกันเลขหาย"
        );
      }


      totalEl.textContent =
        total;


      setProgress(
        8,
        `พบจำนวนทั้งหมด ${total} รายการ กำลังเตรียมรูป...`
      );


      /* ---------------------
         2. Make columns
      --------------------- */

      const columns =
        await makeColumns();


      /* ---------------------
         3. Read 4 columns
      --------------------- */

      for (
        let columnIndex = 0;
        columnIndex < 4;
        columnIndex++
      ) {

        /*
         * ตรงนี้สำคัญมาก:
         *
         * ฟังก์ชันจะไม่จบ
         * จนกว่าคอลัมน์นี้จะครบ
         *
         * ถ้า Error / ขาดเลข
         * จะ retry คอลัมน์เดิม
         */

        const items =
          await readOneColumnUntilComplete(
            columns[columnIndex],
            columnIndex,
            total
          );


        /*
         * เพิ่มข้อมูลของคอลัมน์
         * หลังจากตรวจว่าครบแล้วเท่านั้น
         */

        mergeItems(items);


        const progress =
          10 +
          ((columnIndex + 1) / 4) * 82;


        setProgress(
          progress,
          `คอลัมน์ ${columnIndex + 1}/4 สำเร็จ — ได้ ${items.length} รายการ`
        );
      }


      /* ---------------------
         4. Final verification
      --------------------- */

      const expected =
        Array.from(
          {
            length: total
          },
          (_, i) => i + 1
        );


      const got =
        new Set(
          all.map(
            item => item.seq
          )
        );


      const missing =
        expected.filter(
          seq => !got.has(seq)
        );


      /*
       * ถ้ามีเลขหาย
       * ห้ามบอกว่าสำเร็จ
       */

      if (
        missing.length
      ) {

        throw new Error(
          `ยังขาดลำดับ #${missing.join(", #")} — ระบบหยุดและไม่ข้าม`
        );
      }


      /*
       * ตรวจจำนวนสุดท้ายอีกชั้น
       */

      if (
        all.length !== total
      ) {

        throw new Error(
          `จำนวนไม่ตรง: ได้ ${all.length}/${total} รายการ`
        );
      }


      setProgress(
        100,
        `อ่านครบ ${total}/${total} รายการแล้ว`
      );


      setMessage(
        "ok",
        `อ่านสำเร็จครบทุกเลข ${total}/${total} รายการ`
      );


    } catch (error) {

      /*
       * ไม่ข้าม
       * ไม่แสดงว่าสำเร็จ
       */

      setMessage(
        "err",
        `หยุดการอ่าน: ${error.message}`
      );


      statusEl.textContent =
        "ยังอ่านไม่ครบ — ไม่มีการข้ามคอลัมน์";


    } finally {

      busy = false;

      readBtn.disabled =
        !originalDataUrl;

      clearBtn.disabled =
        false;
    }

  }
);


/* =========================
   Clear
========================= */

clearBtn.addEventListener(
  "click",
  () => {

    busy = false;

    originalDataUrl =
      "";

    all = [];

    fileInput.value =
      "";

    preview.removeAttribute(
      "src"
    );

    preview.style.display =
      "none";

    readBtn.disabled =
      true;

    totalEl.textContent =
      "-";

    setProgress(
      0,
      "กรุณาเลือกรูป"
    );

    setMessage(
      "",
      ""
    );

    searchInput.value =
      "";

    render();

    logEl.textContent =
      "";
  }
);


/* Initial */
render();

</script>

</body>
</html>
